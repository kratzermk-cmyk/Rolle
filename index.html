function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
async function wake(on){try{if(on&&!WL&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");if(!on&&WL){await WL.release();WL=null}}catch(e){WL=null}}
function timerBox(id,pr,rxStr,restStr){
  const side=/\/(Seite|Bein)/.test(rxStr)||id==="copen"||id==="sideplank",r=String(restStr||"").match(/^(\d+)\s*s/);
  TM={target:pr.reps,sets:Math.max(1,pr.sets),side,rest:r?+r[1]:5,set:0,sideIx:0,phase:"idle",run:false,end:0,left:pr.reps,dur:pr.reps,held:[],last:null,iv:null};
  return `<div class="timerbox" id="timerbox" data-ph="idle">
    <h3>${dd("sun","y","width:30px;height:30px")}Stoppuhr<button class="snd" data-tm="sound" aria-label="Ton an/aus">${SOUND?"🔊":"🔇"}</button></h3>
    <div class="tm-face">
      <div class="tm-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="bar" id="tmBar" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="tm-time" id="tmTime" role="timer" aria-live="off">${fmtT(pr.reps)}</div></div>
      <div><div class="tm-lbl" id="tmLbl"></div><p class="tm-sub" id="tmSub"></p><div class="tm-dots" id="tmDots"></div>
        <div class="tm-adj"><button class="btn" data-tm="minus" aria-label="5 Sekunden weniger">−5 s</button><button class="btn" data-tm="plus" aria-label="5 Sekunden mehr">+5 s</button></div></div>
    </div>
    <div class="tm-acts"><button class="btn dark big" id="tmMain" data-tm="main">Start</button><button class="btn" id="tmSkip" data-tm="skip" hidden>Weiter ›</button><button class="btn" data-tm="reset">Reset</button></div>

function tmLabel(){const t=TM,sd=t.side?(t.sideIx?" · Rechts":" · Links"):"";
  if(t.phase==="done")return["Geschafft!",`${t.sets}× ${t.target} s${t.side?" pro Seite":""} – Zeiten stehen unten im Eintrag.`];
  if(t.phase==="ready")return["Bereit …",`Satz ${t.set+1}/${t.sets}${sd} startet gleich`];
  if(t.phase==="rest")return[t.side&&t.sideIx===1?"Seite wechseln":"Pause",`Gleich: Satz ${t.set+1}/${t.sets}${sd}`];
  if(t.phase==="hold")return["Halten!",`Satz ${t.set+1}/${t.sets}${sd} · Ziel ${t.target} s`];
  return[`${t.sets}× ${t.target} s${t.side?" pro Seite":""}`,`Satz ${t.set+1}/${t.sets}${sd} · Start drücken, 3 s Vorlauf`]}
function tmDraw(){const t=TM,box=document.getElementById("timerbox");if(!t||!box)return;
  const left=t.run?Math.max(0,(t.end-Date.now())/1000):t.left;
  box.dataset.ph=t.phase;
  document.getElementById("tmTime").textContent=t.phase==="done"?"✓":fmtT(left);
  const frac=t.phase==="idle"||t.phase==="done"?1:Math.min(1,left/(t.dur||1));
  document.getElementById("tmBar").setAttribute("stroke-dashoffset",(326.7*(1-frac)).toFixed(1));

  document.getElementById("tmSkip").hidden=!(t.phase==="rest"||t.phase==="ready");
  document.getElementById("tmMain").textContent=t.phase==="done"?"Nochmal":t.run?"Pause":t.phase==="idle"?"Start":"Weiter";

function tmPhase(ph,sec){const t=TM;t.phase=ph;t.dur=sec;t.left=sec;t.end=Date.now()+sec*1000;t.last=Math.ceil(sec)}
function tmTick(){const t=TM;if(!t||!t.run)return;
  const left=(t.end-Date.now())/1000,sec=Math.ceil(left);
  if(sec!==t.last&&sec>0&&sec<=3){t.last=sec;beep(t.phase==="hold"?660:880,.1)}
  if(left<=0)tmNext();
  tmDraw()}
function tmFlash(){const b=document.getElementById("timerbox");if(!b)return;b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash")}
function tmNext(){const t=TM;
  if(t.phase==="ready"||t.phase==="rest"){tmPhase("hold",t.target);beep(1175,.25);buzz(120);return}
  // Haltezeit vorbei
  beep(1320,.18);setTimeout(()=>beep(1320,.18),220);setTimeout(()=>beep(1760,.4),440);buzz([200,100,200]);tmFlash();
  t.held[t.set]=Math.min(t.held[t.set]??Infinity,t.target);
  if(t.side&&t.sideIx===0){t.sideIx=1;tmPhase("rest",5);return}
  t.sideIx=0;t.set++;
  if(t.set>=t.sets){t.phase="done";t.run=false;clearInterval(t.iv);wake(false);tmFill();roar(`${t.sets}× ${t.target} s gehalten!`);return}
  tmPhase("rest",t.rest);
}
function tmFill(){// gehaltene Sekunden in „Heute eintragen“ übernehmen
  const box=document.getElementById("sets");if(!box||!TM)return;const unit=document.getElementById("logbox").dataset.unit;
  let rows=readSets();while(rows.length<TM.held.length)rows.push([0,0,0]);
  TM.held.forEach((h,i)=>{rows[i][1]=h});
  box.innerHTML=rows.map((r,i)=>setRow(i,r[0]||"",r[1],unit,r[2])).join("");
}
function tmCmd(c){const t=TM;if(!t)return;
  if(c==="sound"){SOUND=!SOUND;LS.set("kp_sound",SOUND);const b=document.querySelector("#timerbox .snd");if(b)b.textContent=SOUND?"🔊":"🔇";if(SOUND)beep(880,.08);return}
  if(c==="main"){
    if(t.run){t.left=Math.max(0,(t.end-Date.now())/1000);t.run=false;clearInterval(t.iv);wake(false);tmDraw();return}
    beep(0,.01,.0001);// Audio im Tipp freischalten (iOS)
    if(t.phase==="done"){t.set=0;t.sideIx=0;t.held=[];t.phase="idle"}
    if(t.phase==="idle"){tmPhase("ready",3);t.last=4}else{t.end=Date.now()+t.left*1000;t.last=Math.ceil(t.left)}
    t.run=true;clearInterval(t.iv);t.iv=setInterval(tmTick,200);wake(true);tmDraw();return}
  if(c==="reset"){clearInterval(t.iv);wake(false);Object.assign(t,{set:0,sideIx:0,phase:"idle",run:false,left:t.target,dur:t.target,held:[]});tmDraw();return}
  if(c==="skip"){if(t.phase==="rest"||t.phase==="ready"){t.end=Date.now();tmTick()}return}
  if(c==="plus"||c==="minus"){const d=c==="plus"?5:-5;const nt=Math.max(5,Math.min(600,t.target+d));const diff=nt-t.target;t.target=nt;
    if(t.phase==="idle"){t.left=nt;t.dur=nt}
    else if(t.phase==="hold"){t.dur+=diff;if(t.run)t.end+=diff*1000;else t.left=Math.max(0,t.left+diff)}
    tmDraw()}
}
function tmStop(){if(TM){clearInterval(TM.iv);TM.run=false}TM=null;wake(false)}

/* ---------- Pausen- & EMOM-Uhr (für Übungen ohne Halte-Zeit) ---------- */
let CK=null;
function ckSecs(rest,ses){const s=String(rest||"");let m=s.match(/^(\d+)(?:[–-]\d+)?\s*min/);if(m)return +m[1]*60;m=s.match(/^(\d+)(?:[–-]\d+)?\s*s/);if(m)return +m[1];
  if(s==="Zirkel")return ses==="KB"?120:90;return 0}
function clockBox(rxStr,pr,restStr,ses){
  const emom=/jede Minute/.test(rxStr)||/Rest der Minute/.test(restStr||""),sec=emom?60:ckSecs(restStr,ses);if(!sec){CK=null;return""}
  CK={mode:emom?"emom":"rest",base:sec,dur:sec,rounds:emom?Math.max(1,pr.sets):0,round:0,phase:"idle",run:false,end:0,left:sec,last:null,iv:null,circ:restStr==="Zirkel"};
  const title=emom?"EMOM-Uhr":CK.circ?"Rundenpause":"Pausen-Uhr";
  return `<div class="timerbox ck" id="ckbox" data-ph="idle">
    <h3>${dd("sun","y","width:30px;height:30px")}${title}<button class="snd" data-ck="sound" aria-label="Ton an/aus">${SOUND?"🔊":"🔇"}</button></h3>
    <div class="tm-face">
      <div class="tm-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="bar" id="ckBar" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="tm-time" id="ckTime" role="timer" aria-live="off">${fmtT(sec)}</div></div>
      <div><div class="tm-lbl" id="ckLbl"></div><p class="tm-sub" id="ckSub"></p><div class="tm-dots" id="ckDots"></div>
        ${emom?"":`<div class="tm-adj"><button class="btn" data-ck="minus" aria-label="15 Sekunden weniger">−15 s</button><button class="btn" data-ck="plus" aria-label="15 Sekunden mehr">+15 s</button></div>`}</div>
    </div>
    <div class="tm-acts"><button class="btn dark big" id="ckMain" data-ck="main">Start</button><button class="btn" data-ck="reset">Reset</button></div>
  </div>`}
function ckLabel(){const c=CK;
  if(c.mode==="rest"){
    if(c.phase==="go")return["Los!",c.circ?"Nächste Runde. Nach der Runde wieder Start.":"Nächster Satz. Danach wieder Start für die Pause."];
    if(c.phase==="rest")return["Pause",c.circ?"Gleich: nächste Runde":"Gleich: nächster Satz"];
    return[`Pause ${fmtT(c.base)}`,c.circ?"Nach jeder Runde Start drücken":"Nach jedem Satz Start drücken"]}
  if(c.phase==="done")return["Geschafft!",`${c.rounds} Runden jede Minute`];
  if(c.phase==="ready")return["Bereit …","Runde 1 startet gleich"];
  if(c.phase==="hold")return[`Runde ${c.round+1}/${c.rounds}`,"Wiederholungen, dann Rest der Minute Pause"];
  return[`${c.rounds}× jede Minute`,"Start drücken, 3 s Vorlauf. Jede volle Minute neu starten."]}
function ckDraw(){const c=CK,box=document.getElementById("ckbox");if(!c||!box)return;
  const left=c.run?Math.max(0,(c.end-Date.now())/1000):c.left;box.dataset.ph=c.phase;
  document.getElementById("ckTime").textContent=c.phase==="done"?"✓":c.phase==="go"?"Los":fmtT(left);
  const frac=c.phase==="idle"||c.phase==="done"||c.phase==="go"?1:Math.min(1,left/(c.dur||1));
  document.getElementById("ckBar").setAttribute("stroke-dashoffset",(326.7*(1-frac)).toFixed(1));
  const [l,s]=ckLabel();document.getElementById("ckLbl").textContent=l;document.getElementById("ckSub").textContent=s;
  document.getElementById("ckDots").innerHTML=c.mode==="emom"?Array.from({length:Math.min(c.rounds,24)},(_,i)=>`<i class="${i<c.round||c.phase==="done"?"on":i===c.round&&c.phase==="hold"?"cur":""}"></i>`).join(""):"";
  document.getElementById("ckMain").textContent=c.phase==="done"?"Nochmal":c.run?"Pause":c.phase==="idle"||c.phase==="go"?"Start":"Weiter"}
function ckPhase(ph,sec){const c=CK;c.phase=ph;c.dur=sec;c.left=sec;c.end=Date.now()+sec*1000;c.last=Math.ceil(sec)}
function ckFlash(){const b=document.getElementById("ckbox");if(!b)return;b.classList.remove("flash");void b.offsetWidth;b.classList.add("flash")}
function ckHalt(){const c=CK;c.run=false;clearInterval(c.iv);wake(false)}
function ckTick(){const c=CK;if(!c||!c.run)return;const left=(c.end-Date.now())/1000,sec=Math.ceil(left);
  if(sec!==c.last&&sec>0&&sec<=3){c.last=sec;beep(880,.1)}
  if(left<=0)ckNext();ckDraw()}
function ckNext(){const c=CK;
  if(c.mode==="rest"){c.phase="go";c.left=c.base;ckHalt();beep(1320,.18);setTimeout(()=>beep(1760,.4),220);buzz([200,100,200]);ckFlash();return}
  if(c.phase==="ready"){ckPhase("hold",60);beep(1175,.3);buzz(150);return}
  c.round++;if(c.round>=c.rounds){c.phase="done";ckHalt();beep(1320,.18);setTimeout(()=>beep(1320,.18),220);setTimeout(()=>beep(1760,.4),440);buzz([200,100,200]);ckFlash();roar(`${c.rounds} Runden geschafft!`);return}
  ckPhase("hold",60);beep(1175,.3);buzz(150);ckFlash()}
function ckCmd(k){const c=CK;if(!c)return;
  if(k==="sound"){SOUND=!SOUND;LS.set("kp_sound",SOUND);document.querySelectorAll("#sheetRoot .snd").forEach(b=>b.textContent=SOUND?"🔊":"🔇");if(SOUND)beep(880,.08);return}
  if(k==="main"){
    if(c.run){c.left=Math.max(0,(c.end-Date.now())/1000);ckHalt();ckDraw();return}
    beep(0,.01,.0001);
    if(c.phase==="done"){c.round=0;c.phase="idle"}
    if(c.phase==="idle"||c.phase==="go"){if(c.mode==="rest")ckPhase("rest",c.base);else{ckPhase("ready",3);c.last=4}}

  if(k==="reset"){ckHalt();Object.assign(c,{round:0,phase:"idle",left:c.base,dur:c.base});ckDraw();return}
  if(k==="plus"||k==="minus"){c.base=Math.max(15,Math.min(600,c.base+(k==="plus"?15:-15)));if(!c.run&&c.phase!=="rest"){c.left=c.dur=c.base}ckDraw()}

  return Object.values(EXT).filter(x=>x.date===d.date).sort((a,b)=>(a.created||"").localeCompare(b.created||"")).map(x=>{const sp=SPORT[x.sport]||SPORT.rest;
    return`<div class="pu xunit" data-uref="x:${esc(x.id)}"><div class="pu-row"><div class="pu-h"><span class="spdot" style="background:${sp[1]}" title="${sp[0]}"></span><b>${esc(x.title)}</b></div><button class="pu-edit" data-xdel="${esc(x.id)}" aria-label="${esc(x.title)} löschen">×</button></div><span class="pend xtag">Nachgetragen</span>${x.note?`<p>${esc(x.note)}</p>`:""}${revBlock(d,{title:x.title,sport:x.sport},0,0,0,t,"x:"+x.id)}</div>`}).join("")}
function openExtra(date){
  const wd=["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(date+"T12:00:00").getDay()];
  document.getElementById("sheetRoot").innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Einheit nachtragen">
    <div class="grab"></div>
    <div class="hd"><div><span class="label">${wd} ${fmtDate(date)}</span><h2 style="margin-top:4px">Einheit nachtragen</h2></div><button class="x" data-close aria-label="Schließen">×</button></div>
    <form class="fb" id="xForm" data-date="${date}">
      <div class="f">Sportart<div class="seg">${["swim","bike","run","kraft"].map((k,i)=>`<label><input type="radio" name="xSport" value="${k}"${i===0?" checked":""}><span>${SPORT[k][0]}</span></label>`).join("")}</div></div>
      <label class="f" for="xMin">Dauer in Minuten<input id="xMin" class="sel" type="number" inputmode="numeric" min="1" max="600" placeholder="z. B. 40"></label>
      <label class="f" for="xNote">Was hast du gemacht?<span class="hint">Optional. Mit „Mit Strava auswerten“ holt Claude danach die Daten.</span><textarea id="xNote" rows="2" maxlength="400" placeholder="z. B. 1.500 m locker nach dem Radfahren"></textarea></label>
      <button class="btn dark big" type="submit">Eintragen</button>
    </form></div></div>`;
  const f=document.getElementById("xForm");f.onsubmit=ev=>{ev.preventDefault();saveExtra(f)};
}
async function saveExtra(f){
  const sport=(f.querySelector('input[name="xSport"]:checked')||{}).value||"swim";
  const min=parseInt(document.getElementById("xMin").value,10);const note=(document.getElementById("xNote").value||"").trim();
  const id="x"+Date.now().toString(36);
  const title=`${SPORT[sport][0]}${min>0?" "+min+" min":""} (nachgetragen)`;
  const doc={id,created:new Date().toISOString(),date:f.dataset.date,sport,title,min:min>0?min:null,note};
  f.querySelector('button[type="submit"]').disabled=true;
  try{if(!PDB)throw 0;await PDB.collection("extras").doc(id).set(doc)}catch(e){f.querySelector('button[type="submit"]').disabled=false;roar("Speichern hat nicht geklappt.");return}
  closeSheet();roar("Eingetragen. Tipp auf „Mit Strava auswerten“, wenn Claude sie anschauen soll.");
}
async function delExtra(id){const x=EXT[id];if(!x||!confirm(`„${x.title}“ löschen?`))return;try{if(PDB)await PDB.collection("extras").doc(id).delete()}catch(e){roar("Löschen hat nicht geklappt.")}}
function initReviews(){try{if(PDB)PDB.collection("reviews").orderBy("created","desc").limit(40).onSnapshot(s=>{REV={};s.docs.forEach(d=>{REV[d.id]=d.data()});planRender()},()=>{})}catch(e){}}
async function sendReview(ref,btn){
  let d,u;
  if(ref.startsWith("x:")){const x=EXT[ref.slice(2)];if(!x)return;d={date:x.date,d:["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(x.date+"T12:00:00").getDay()]};u={title:x.title,sport:x.sport,note:x.note||""}}
  else{({d,u}=unitAt(ref))}
  if(!u)return;
  if(btn)btn.disabled=true;
  if(CM&&CAN_SEND!=="available")CAN_SEND=await CM.canSendToClaude().catch(()=>"off");
  const id="r"+Date.now().toString(36);
  const rd=u.sport==="bike"?rideFor(d.date,u.title):null;
  const text=`${rd?"Rollen-Auswertung":"Strava-Auswertung"} ${id}\nEinheit: ${u.title} (${d.d} ${fmtDate(d.date)})${rd?`\nRollen-Fahrt in der App: rides/${rd.id}`:""}${u.note?`\nGeplant: ${u.note}`:""}`;
  const doc={id,created:new Date().toISOString(),date:d.date,unit:u.title,sport:u.sport,status:"angefragt"};if(rd)doc.rideId=rd.id;
  let sent=false;
  try{if(CM&&CAN_SEND==="available"){const el=document.querySelector(`[data-uref="${ref}"]`)||document.getElementById("app");const anchor=await CM.anchorFor(el);const r=await CM.sendToClaude({anchor,text});doc.threadId=r.threadId;sent=true}}catch(e){}
  if(!sent){if(btn)btn.disabled=false;roar("Senden hat nicht geklappt. Schreib Claude kurz im Chat: „Werte "+u.title+" vom "+fmtDate(d.date)+" aus“.");return}
  try{if(PDB)await PDB.collection("reviews").doc(id).set(doc)}catch(e){}
  roar("Angefragt! Claude holt die Daten aus Strava. Die Auswertung erscheint direkt bei der Einheit.");
}
/* ---------- Planänderungen (anfragen → Vorschlag von Claude → übernehmen) ---------- */
// Anfrage: Dokument changes/<id> + Kommentar an Claude. Claude schreibt proposal (+ newWeeks) und status "vorschlag"; „Übernehmen" schreibt newWeeks nach coach/plan.
let CHG={},CM=null,CAN_SEND="off",CHGCTX=null;
const CHG_ACT={move:"Verschieben",change:"Länger / anders",drop:"Streichen",add:"Hinzufügen"};
const CHG_ST={offen:"Wartet auf Claude",vorschlag:"Vorschlag",übernommen:"Übernommen",abgelehnt:"Abgelehnt"};
function chgFor(date,title){return Object.values(CHG).find(c=>(c.status==="offen"||c.status==="vorschlag")&&c.date===date&&c.unit===title)}
async function initChanges(){
  try{
    if(PDB)PDB.collection("changes").orderBy("created","desc").limit(15).onSnapshot(s=>{CHG={};s.docs.forEach(d=>{CHG[d.id]=d.data()});planRender()},()=>{});
    CM=window.claude&&window.claude.use?await claude.use("comments"):null;
    if(CM)CAN_SEND=await CM.canSendToClaude().catch(()=>"off");
  }catch(e){}
}
function planDays(){const t=today(),out=[];(PLAN&&PLAN.weeks||[]).forEach(w=>(w.days||[]).forEach(d=>{if(d.date&&d.date>=t)out.push(d)}));return out}
function openChange(ref){
  const [wi,di,ui]=ref.split(".").map(Number),w=PLAN.weeks[wi],d=w&&w.days[di];if(!d)return;
  const u=ui>=0?d.units[ui]:null;CHGCTX={ref,date:d.date,day:`${d.d} ${fmtDate(d.date)}`,unit:u?u.title:"",sport:u?u.sport:""};
  if(CM)CM.canSendToClaude().then(v=>{CAN_SEND=v}).catch(()=>{CAN_SEND="off"});
  const acts=u?["move","change","drop"]:["add"];
  const opts=planDays().map(x=>`<option value="${x.date}"${x.date===d.date?" selected":""}>${esc(x.d)} ${fmtDate(x.date)}</option>`).join("");
  document.getElementById("sheetRoot").innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Plan ändern">
    <div class="grab"></div>
    <div class="hd"><div><span class="label">${esc(CHGCTX.day)}</span><h2 style="margin-top:4px">${u?esc(u.title):"Einheit hinzufügen"}</h2></div><button class="x" data-close aria-label="Schließen">×</button></div>
    <form class="fb" id="chgForm">
      <div class="f">Was möchtest du?<div class="seg">${acts.map((a,i)=>`<label><input type="radio" name="chgAct" value="${a}"${i===0?" checked":""}><span>${CHG_ACT[a]}</span></label>`).join("")}</div></div>
      ${u?"":`<div class="f">Sportart<div class="seg">${["bike","run","swim","kraft"].map((k,i)=>`<label><input type="radio" name="chgSport" value="${k}"${i===0?" checked":""}><span>${SPORT[k][0]}</span></label>`).join("")}</div></div>`}
      <label class="f" for="chgDay" id="chgDayWrap"${u?" hidden":""}>${u?"Auf welchen Tag?":"An welchem Tag?"}<select id="chgDay" class="sel">${opts}</select></label>
      <label class="f" for="chgNote">Was genau?<span class="hint">Claude schlägt dir daraufhin vor, wie sich der Rest der Woche ändert.</span><textarea id="chgNote" rows="3" maxlength="600" placeholder="${u?"z. B. Morgen wird das Wetter schön, ich würde gern 3–4 h Rad fahren":"z. B. Mittags 30 min locker laufen"}"></textarea></label>
      <button class="btn dark big" type="submit" data-chg-send>An Claude senden</button>
      <p class="hint" id="chgHint"></p>
    </form></div></div>`;
  const f=document.getElementById("chgForm");
  f.onchange=()=>{const a=(f.querySelector('input[name="chgAct"]:checked')||{}).value;document.getElementById("chgDayWrap").hidden=!(a==="move"||a==="add")};
  f.onsubmit=ev=>{ev.preventDefault();sendChange(f.querySelector("[data-chg-send]"))};
  document.getElementById("chgNote").focus();
}
async function sendChange(btn){
  const c=CHGCTX;if(!c)return;const f=document.getElementById("chgForm");
  const act=(f.querySelector('input[name="chgAct"]:checked')||{}).value||"change";
  const sport=c.sport||(f.querySelector('input[name="chgSport"]:checked')||{}).value||"";
  const target=(act==="move"||act==="add")?document.getElementById("chgDay").value:"";
  const note=document.getElementById("chgNote").value.trim().slice(0,600);
  if(act!=="drop"&&!note&&act!=="move"){document.getElementById("chgHint").textContent="Schreib kurz dazu, was du vorhast.";return}
  const id="c"+Date.now().toString(36);
  const tgt=target?planDays().find(x=>x.date===target):null;
  const text=`Planänderung ${id}\n${CHG_ACT[act]}: ${c.unit||SPORT[sport]?.[0]||"Einheit"} (${c.day})${tgt&&act==="move"?` → ${tgt.d} ${fmtDate(tgt.date)}`:""}${tgt&&act==="add"?` am ${tgt.d} ${fmtDate(tgt.date)}`:""}${note?`\n${note}`:""}`;
  const doc={id,created:new Date().toISOString(),action:act,unit:c.unit,date:c.date,target,sport,note,status:"offen"};
  btn.disabled=true;let sent=false;
  try{if(CM&&CAN_SEND==="available"){const el=document.querySelector(`[data-uref="${c.ref}"]`)||document.getElementById("app");const anchor=await CM.anchorFor(el);const r=await CM.sendToClaude({anchor,text});doc.threadId=r.threadId;sent=true}}catch(e){}
  try{if(PDB)await PDB.collection("changes").doc(id).set(doc)}catch(e){if(!sent){btn.disabled=false;document.getElementById("chgHint").textContent="Speichern hat nicht geklappt. Bitte nochmal.";return}}
  closeSheet();render();
  roar(sent?"An Claude geschickt. Der Vorschlag erscheint oben im Plan.":"Gespeichert. Schreib Claude kurz im Chat, dass eine Änderung wartet.");
}
async function answerChange(id,ok){
  const c=CHG[id];if(!c||!PDB)return;
  try{
    if(ok&&Array.isArray(c.newWeeks)&&PLAN)await PDB.doc("coach/plan").set({...PLAN,weeks:c.newWeeks,updated:today()});
    await PDB.collection("changes").doc(id).update({status:ok?"übernommen":"abgelehnt",answeredAt:new Date().toISOString()});
    roar(ok?"Plan angepasst.":"Abgelehnt. Schreib Claude im Kommentar, was besser passt.");
    if(CM&&c.threadId&&CAN_SEND==="available")CM.sendToClaude({threadId:c.threadId,text:ok?`Vorschlag ${id} übernommen.`:`Vorschlag ${id} abgelehnt.`}).catch(()=>{});
  }catch(e){roar("Das hat nicht geklappt. Bitte nochmal.")}
}
function chgCard(){
  const list=Object.values(CHG).sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  const open=list.filter(c=>c.status==="offen"||c.status==="vorschlag"),done=list.filter(c=>!(c.status==="offen"||c.status==="vorschlag")).slice(0,3);
  if(!open.length&&!done.length)return "";
  const row=c=>`<div class="chg ${c.status==="vorschlag"?"prop":""}"><div class="chg-h"><b>${CHG_ACT[c.action]||"Änderung"}: ${esc(c.unit||SPORT[c.sport]?.[0]||"Einheit")}</b><span class="tag-st st-${c.status}">${CHG_ST[c.status]||esc(c.status)}</span></div>
    ${c.note?`<p class="muted">„${esc(c.note)}“</p>`:""}
    ${c.status==="vorschlag"&&c.proposal?`<div class="coach"><strong>Vorschlag von Claude</strong><p>${esc(c.proposal)}</p></div><div class="logacts"><button class="btn dark big" data-chg-ok="${c.id}">Übernehmen</button><button class="btn" data-chg-no="${c.id}">Ablehnen</button></div>`:""}</div>`;
  return `<div class="card">${dd("arrow","corner o")}<h3>Änderungen</h3>${open.map(row).join("")}${done.length?`<p class="label" style="margin-top:12px">Zuletzt</p>${done.map(c=>`<p style="font-size:14px;margin-top:4px">${esc(CHG_ACT[c.action]||"")}: ${esc(c.unit||"")} · <span class="muted">${CHG_ST[c.status]||esc(c.status)}</span></p>`).join("")}`:""}</div>`;
}
function vPlan(){
  const t=today();let body;
  if(PLAN_STATE==="loading")body=`<div class="card empty">${dino("run")}<p><b>Plan wird geladen …</b></p></div>`;
  else if(PLAN_STATE!=="ok")body=`<div class="card empty">${dino("sleep")}<p><b>${PLAN_STATE==="empty"?"Noch kein Plan eingetragen.":"Plan gerade nicht erreichbar."}</b></p><p class="muted" style="font-size:14px">${PLAN_STATE==="empty"?"Claude trägt hier immer die nächsten zwei Wochen ein.":"Der Plan liegt in deinem Claude-Konto. Öffne die App angemeldet in claude.ai oder in der Claude-App."}</p></div>`;
  else if(PLANVIEW==="historie"){const P=PLAN,arch=(P.archive||[]).map((w,i)=>[w,"a"+i]),cur=(P.weeks||[]).map((w,i)=>[w,i]);
    const hw=arch.concat(cur).filter(([w])=>(w.days||[]).some(d=>d.date&&d.date<t)).reverse();
    body=`${planSeg()}<p class="muted" style="font-size:14px;margin:4px 0 8px">Alle vergangenen Tage, neueste oben. Hier kannst du abhaken, nachtragen und auswerten lassen.</p>${hw.map(([w,i])=>planWeek(w,t,i,{f:d=>d.date&&d.date<t,rev:true})).join("")||`<div class="card empty">${dino("sleep")}<p><b>Noch keine vergangenen Einheiten.</b></p></div>`}`}
  else{const P=PLAN,weeks=(P.weeks||[]).map((w,i)=>[w,i]).filter(([w])=>!w.end||w.end>=t);
    const todayHtml=weeks.map(([w,i])=>planWeek(w,t,i,{f:d=>d.date===t,title:"Heute · "+(((w.days||[]).find(d=>d.date===t)||{}).d||"")+" "+fmtDate(t)})).join("");
    body=`${planSeg()}${checkCard()}${wrevCard()}${todayHtml}
    ${chgCard()}
    ${weeks.map(([w,i])=>planWeek(w,t,i,{f:d=>!d.date||d.date>t})).join("")}
    <div class="card hello">${dino("run")}<div class="bubble">${esc(P.headline||"Deine nächsten zwei Wochen")}<small>${esc(P.phase||"")}${P.updated?` · Stand ${fmtDate(P.updated)}`:""}</small></div></div>
    ${P.intro?`<p style="font-size:15px">${esc(P.intro)}</p>`:""}
    <div class="sportkey">${Object.values(SPORT).map(([n,c])=>`<span><i class="spdot" style="background:${c}"></i>${n}</span>`).join("")}<span><b style="text-decoration:underline;text-decoration-color:var(--c-core);text-decoration-thickness:2px">unterstrichen</b>&nbsp;= Einheit öffnen</span><span><b>✎</b>&nbsp;= ändern, verschieben, streichen</span></div>
    ${weeks.length?"":`<div class="card empty">${dino("sleep")}<p><b>Die geplanten Wochen sind vorbei.</b></p><p class="muted" style="font-size:14px">Schick deine Rückmeldung, dann kommen die nächsten zwei Wochen.</p></div>`}
    ${seasonCard()}
    ${P.zones&&P.zones.length?`<div class="card">${dd("bolt","corner y")}<h3>Deine Trainingswerte</h3>${P.zonesNote?`<p class="muted" style="font-size:14px;margin-top:2px">${esc(P.zonesNote)}</p>`:""}<div class="zones">${P.zones.map(z=>`<div class="zrow"><span class="spdot" style="background:${(SPORT[z.sport]||SPORT.rest)[1]}"></span><b>${esc(z.label)}</b><span class="mono">${esc(z.value)}</span></div>`).join("")}</div></div>`:""}
    ${P.travel&&P.travel.length?`<div class="card">${dd("heart","corner r")}<h3>Unterwegs? Reise-Variante</h3><ul class="plain">${P.travel.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${P.brakes&&P.brakes.length?`<div class="card">${dd("arrow","corner k thin")}<h3>Wann du bremst</h3><ul class="rules" style="margin-top:10px">${P.brakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}`}
  return `<section class="view">${body}${PLANVIEW==="historie"?"":fbCard()}</section>`;
}
function planSeg(){return`<div class="planseg" role="tablist" aria-label="Plan">${[["kommend","Heute & kommend"],["historie","Trainingshistorie"]].map(([k,l])=>`<button role="tab" aria-selected="${PLANVIEW===k}" data-pv="${k}">${l}</button>`).join("")}</div>`}
const FB_LABELS=[["fatigue","Müdigkeit (1–10)"],["sleep","Schlaf"],["pain","Beschwerden"],["missed","Ausgefallen / geändert"],["runs","Läufe"],["travel","Reisetage"],["notes","Sonstiges"]];
function revHtml(r,top){if(!r||!Array.isArray(r.sections))return"";
  return`<div class="coach wrev">${top?"":`<button type="button" class="wsay" data-wsay="${esc(r.week||"")}" aria-label="Vorlesen">🔊</button>`}<strong>Wochenbilanz von Claude</strong>${r.intro?`<p>${esc(r.intro)}</p>`:""}${r.sections.map(x=>`<h4>${esc(x.h||"")}</h4><ul>${(x.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</div>`}
function revText(r){return [r.intro||""].concat((r.sections||[]).map(x=>(x.h||"")+". "+(x.items||[]).join(" "))).join(" ")}
function wrevCard(){const k=Object.keys(FB).filter(k=>FB[k].review&&k>=isoDay(new Date(Date.now()-5*864e5))).sort().pop();if(!k)return"";const r={...FB[k].review,week:k};
  return`<div class="card"><button type="button" class="wsay" data-wsay="${esc(k)}" aria-label="Vorlesen" style="float:right">🔊</button><h3>Wochenbilanz</h3><p class="muted" style="font-size:14px;margin-top:2px">Woche bis ${fmtDate(k)}</p>${revHtml(r,true)}</div>`}
function fbCard(){
  const wk=weekEdge(true),mon=weekEdge(false),cur=FB[wk];
  const v=FBDRAFT&&FBDRAFT.week===wk?FBDRAFT:(cur||{fatigue:5,sleep:""});
  const head=`${dd("feet","corner g")}<h3>Sonntags-Rückmeldung</h3><p class="muted" style="font-size:14px;margin-top:2px">Woche ${fmtDate(mon)}–${fmtDate(wk)} · Stichworte reichen. Deine Einheiten liest Claude aus Strava.</p>`;
  if(FB_STATE==="off")return `<div class="card">${head}<p style="margin-top:10px">Rückmeldungen gehen nur, wenn du in claude.ai angemeldet bist. Schreib sie sonst einfach in den Chat.</p></div>`;
  if(FB_STATE==="loading")return `<div class="card">${head}<p class="muted" style="margin-top:10px">Wird geladen …</p></div>`;
  const ta=(id,k,ph)=>`<textarea id="${id}" rows="2" placeholder="${ph}">${esc(v[k]||"")}</textarea>`;
  const past=Object.keys(FB).filter(k=>k!==wk).sort().reverse().slice(0,6);
  return `<div class="card">${head}
   ${cur?`<p class="fbsent">✓ Gesendet am ${fmtDate(String(cur.sentAt||wk).slice(0,10))}. Du kannst sie bis Sonntagabend noch ändern.</p>`:""}
   ${cur&&cur.review?revHtml({...cur.review,week:wk}):cur&&cur.coach?`<div class="coach"><strong>Antwort von Claude</strong><p>${esc(cur.coach)}</p></div>`:cur?`<div class="rev wait"><span class="revdot" aria-hidden="true"></span>Claude schreibt dir die Wochenbilanz …</div>`:""}
   <form class="fb" id="fbForm">
    <div class="f">Wie müde bist du? <span class="hint">1 = frisch, 10 = komplett platt</span><div class="range"><input type="range" id="fbFat" min="1" max="10" step="1" value="${+v.fatigue||5}" aria-label="Müdigkeit 1 bis 10"><output id="fbFatOut">${+v.fatigue||5}</output></div></div>
    <div class="f">Schlaf<div class="seg">${["gut","ok","schlecht"].map(s=>`<label><input type="radio" name="fbSleep" value="${s}"${v.sleep===s?" checked":""}><span>${s}</span></label>`).join("")}</div></div>
    <label class="f" for="fbPain">Beschwerden oder Schmerzen${ta("fbPain","pain","z. B. linke Wade nach dem langen Lauf etwas fest")}</label>
    <label class="f" for="fbMissed">Ausgefallene oder geänderte Einheiten${ta("fbMissed","missed","z. B. Do Schwimmen ausgefallen, Dienstreise")}</label>
    <label class="f" for="fbRuns">Wie haben sich die Läufe angefühlt?${ta("fbRuns","runs","locker, schwer, Puls hoch …")}</label>
    <label class="f" for="fbTravel">Reisetage in den nächsten 2 Wochen<input type="text" id="fbTravel" value="${esc(v.travel||"")}" placeholder="z. B. Mi–Fr unterwegs, Hotel mit Gym"></label>
    <label class="f" for="fbNotes">Sonstiges${ta("fbNotes","notes","Wünsche, Termine, Gewicht …")}</label>
    <button class="btn dark big" type="submit">${cur?"Rückmeldung aktualisieren":"Rückmeldung senden"}</button>
   </form>
   ${past.length?`<div class="fbpast"><span class="label">Frühere Wochen</span>${past.map(k=>{const f=FB[k];return `<details><summary>Woche bis ${fmtDate(k)} · Müdigkeit ${esc(f.fatigue??"–")}</summary><dl>${FB_LABELS.filter(([key])=>f[key]!==undefined&&f[key]!=="").map(([key,l])=>`<dt>${l}</dt><dd>${esc(f[key])}</dd>`).join("")}</dl>${f.review?revHtml({...f.review,week:k}):f.coach?`<div class="coach"><strong>Antwort von Claude</strong><p>${esc(f.coach)}</p></div>`:""}</details>`}).join("")}</div>`:""}
  </div>`;
}
function readFb(){const g=id=>(document.getElementById(id)||{}).value||"";const s=document.querySelector('input[name="fbSleep"]:checked');

async function saveFb(btn){

/* ---------- Tages-Check mit Ampel (checkins/<Datum>; bei Gelb/Rot Kommentar an Claude) ---------- */
let CHK={},CHKEDIT=false,CHKDRAFT=null;
const CHK_Q=[["sleep","Schlaf","0 = miserabel, 10 = richtig gut",7],["fatigue","Müdigkeit","0 = frisch, 10 = komplett platt",3],["legs","Beine","0 = locker, 10 = sehr schwer",3],["achilles","Achilles / Wade","0 = nichts, 10 = starke Schmerzen",0]];
const LIGHT={gruen:["Grün","Training wie geplant.","var(--c-core)"],gelb:["Gelb","Heute nur locker: Intervalle raus, Lauf um ein Drittel kürzen, Puls-Grenzen strikt einhalten.","var(--c-yellow)"],rot:["Rot","Heute kein Lauf und nichts Hartes. Höchstens locker schwimmen oder kurz locker Rad, sonst Pause. Claude meldet sich mit einer Anpassung.","var(--c-red)"]};
function chkLight(v){const s=+v.sleep,f=+v.fatigue,l=+v.legs,a=+v.achilles;
  if(a>=5||f>=8||(s<=3&&f>=6))return"rot";
  if(a>=3||f>=6||l>=7||s<=4)return"gelb";return"gruen"}
function initChecks(){try{if(PDB)PDB.collection("checkins").orderBy("date","desc").limit(21).onSnapshot(s=>{CHK={};s.docs.forEach(d=>{CHK[d.id]=d.data()});if(tab==="plan")planRender()},()=>{})}catch(e){}}
function chkStrip(){const out=[];const d=new Date();for(let i=13;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=isoDay(x),c=CHK[k];const wd=["So","Mo","Di","Mi","Do","Fr","Sa"][x.getDay()];
  out.push(`<span title="${fmtDate(k)}: ${c?LIGHT[c.light][0]:"kein Check"}"><i style="${c?`background:${LIGHT[c.light][2]}`:""}">${c?"":"·"}</i>${wd}</span>`)}
  return `<div class="dc-strip" aria-label="Ampel der letzten 14 Tage">${out.join("")}</div>`}
function checkCard(){
  if(PLAN_STATE==="off")return"";
  const t=today(),c=CHK[t];
  const head=`${dd("heart","corner r")}<h3>Tages-Check</h3><p class="muted" style="font-size:14px;margin-top:2px">20 Sekunden, am besten morgens. Bei Gelb oder Rot bekommt Claude automatisch Bescheid.</p>`;
  if(c&&!CHKEDIT){const L=LIGHT[c.light]||LIGHT.gruen;

      <div class="dc-vals">${CHK_Q.map(([k,l])=>`<span>${l} <b>${esc(c[k])}</b></span>`).join("")}</div>
      ${c.note?`<p class="muted" style="font-size:14px;margin-top:6px">„${esc(c.note)}“</p>`:""}
      ${c.coach?`<div class="coach"><strong>Antwort von Claude</strong><p>${esc(c.coach)}</p></div>`:c.light!=="gruen"&&c.threadId?`<div class="rev wait"><span class="revdot" aria-hidden="true"></span>Claude schaut sich den Plan für heute an …</div>`:""}
      ${chkStrip()}<button class="pu-add" style="margin-top:10px" data-dc="edit">Check ändern</button></div>`}
  const v=CHKDRAFT||(c?{...c}:Object.fromEntries(CHK_Q.map(([k,,,d])=>[k,d])));
  return `<div class="card">${head}<form class="fb dc-q" id="chkForm">
    ${CHK_Q.map(([k,l,h])=>`<div class="f">${l} <span class="hint">${h}</span><div class="range"><input type="range" id="chk_${k}" min="0" max="10" step="1" value="${+v[k]}" aria-label="${l} 0 bis 10"><output id="chk_${k}_o">${+v[k]}</output></div></div>`).join("")}
    <label class="f" for="chkNote">Notiz (optional)<input type="text" id="chkNote" maxlength="200" value="${esc(v.note||"")}" placeholder="z. B. kurz geschlafen, Wade links fest"></label>

  </form>${chkStrip()}</div>`;
}
function readChk(){const o={};CHK_Q.forEach(([k])=>{o[k]=+((document.getElementById("chk_"+k)||{}).value||0)});o.note=((document.getElementById("chkNote")||{}).value||"").trim().slice(0,200);return o}
function todayUnits(){const t=today();for(const w of (PLAN&&PLAN.weeks)||[])for(const d of w.days||[])if(d.date===t)return (d.units||[]).map(u=>u.title).join(", ");return""}
async function saveChk(btn){

/* ---------- Häkchen pro Einheit (done/<Datum>_<Einheit>) + Konstanz (konstanz/<Montag>) ---------- */
let DONE={},KONST={};
const TICK={done:["✓ Erledigt","t-done"],changed:["~ Geändert","t-changed"],missed:["✗ Verpasst","t-missed"]};
const slug=s=>String(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"x";
const doneId=(date,title)=>date+"_"+slug(title);
const counts=u=>u.sport!=="rest"&&!/optional/i.test(u.title||"");
function doneOf(date,title){const x=DONE[doneId(date,title)];return x&&x.status&&x.status!=="none"?x.status:""}
function initDone(){try{if(!PDB)return;
  PDB.collection("done").orderBy("date","desc").limit(120).onSnapshot(s=>{DONE={};s.docs.forEach(d=>{DONE[d.id]=d.data()});planRender()},()=>{});
  PDB.collection("konstanz").orderBy("week","desc").limit(20).onSnapshot(s=>{KONST={};s.docs.forEach(d=>{KONST[d.id]=d.data()});if(tab==="fortschritt")render()},()=>{})}catch(e){}}
function tickRow(d,u,ref,t){if(!d.date||d.date>t||u.sport==="rest")return"";const st=doneOf(d.date,u.title);
  return `<div class="ticks" role="group" aria-label="${esc(u.title)}: erledigt?">${Object.entries(TICK).map(([k,[l,c]])=>`<button class="${c}" aria-pressed="${st===k}" data-tick="${ref}|${k}">${l}</button>`).join("")}</div>`}
function weekStats(w){const t=today();let planned=0,due=0,done=0,changed=0,missed=0;
  (w.days||[]).forEach(d=>(d.units||[]).forEach(u=>{if(u.sport==="rest")return;const st=doneOf(d.date,u.title),c=counts(u);
    if(c)planned++;if(c&&(d.date<t||st))due++;if(st==="done"&&c)done++;if(st==="changed"&&c)changed++;if(st==="missed"&&c)missed++;
    if(!c&&st==="done")done+=0}));
  return{planned,due,done,changed,missed,rate:due?Math.round((done+changed*.5)/due*100):null}}
function weekMonday(w){const d=new Date((w.end||today())+"T12:00:00");d.setDate(d.getDate()-6);return isoDay(d)}
async function setTick(ref,status){
  const {d,u}=unitAt(ref);if(!u||!PDB)return;
  const id=doneId(d.date,u.title),cur=doneOf(d.date,u.title),next=cur===status?"none":status;
  const doc={date:d.date,unit:u.title,sport:u.sport,status:next,at:new Date().toISOString()};
  DONE[id]=doc;render();
  try{await PDB.collection("done").doc(id).set(doc);
    const s=weekStats(w),mon=weekMonday(w);
    await PDB.collection("konstanz").doc(mon).set({week:mon,label:(w.title||"").split("·")[0].trim(),...s,updated:new Date().toISOString()});
    if(next==="done")roar(s.due&&s.done===s.due?"Alles erledigt, was bisher dran war. Stark!":"Abgehakt!")}
  catch(e){roar("Speichern hat nicht geklappt. Bitte nochmal.")}
}
function kqChip(w){const s=weekStats(w);if(!s.due)return"";return `<span class="kq">Konstanz: ${s.done} von ${s.due} erledigt${s.changed?`, ${s.changed} geändert`:""} · ${s.rate} %</span>`}
function konstanzCard(){
  const ws=Object.values(KONST).sort((a,b)=>a.week.localeCompare(b.week)).slice(-12);

  if(!ws.length)return `<div class="card">${head}<p style="margin-top:8px">Noch keine Daten. Hake im Plan bei jeder Einheit ab, ob du sie erledigt, geändert oder verpasst hast.</p></div>`;

  return `<div class="card">${head}<p style="margin-top:8px;font-size:14px">Schnitt der letzten ${ws.length} ${ws.length===1?"Woche":"Wochen"}: <b>${avg} %</b>. Ziel: mindestens 80 %.</p>
   <div class="kbars">${ws.map(x=>`<div class="kbar"><span class="mono">${esc(x.label||fmtDate(x.week))}</span><span class="tr" role="img" aria-label="${x.rate??0} Prozent"><i style="width:${x.rate??0}%;background:${col(x.rate??0)}"></i></span><span class="v">${x.rate??"–"} % <small>${x.done}/${x.due}</small></span></div>`).join("")}</div></div>`;
}

/* ---------- Saison-Zeitstrahl bis zum A-Rennen (aus coach/plan.season) ---------- */
const SZ_COL=["var(--c-kraft)","var(--c-core)","var(--c-power)","var(--c-red)"];
const dnum=s=>Date.parse(s+"T12:00:00");
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return isoDay(d)};
const EV_ICON={test:"★",deload:"▾",race:"⚑"};
function seasonCard(){
  const S=PLAN&&PLAN.season;if(!S||!S.race||!Array.isArray(S.phases)||!S.phases.length)return"";
  const t=today(),a=dnum(S.phases[0].from),b=dnum(S.race.date),pct=x=>Math.max(0,Math.min(100,(dnum(x)-a)/(b-a)*100));
  const days=Math.round((b-dnum(t))/864e5),weeks=Math.floor(days/7);
  const segs=S.phases.map((p,i)=>`<div class="sz-seg" style="left:${pct(p.from)}%;width:${pct(addDays(p.to,1))-pct(p.from)}%;background:${SZ_COL[i%SZ_COL.length]}" title="${esc(p.name)}"></div>`).join("");
  const ev=S.events||[];
  const dl=ev.filter(e=>e.kind==="deload").map(e=>`<div class="sz-dl" style="left:${pct(e.date)}%;width:${pct(addDays(e.date,7))-pct(e.date)}%" title="Entlastung ab ${fmtDate(e.date)}"></div>`).join("");
  const mk=ev.filter(e=>e.kind!=="deload").map(e=>`<span class="sz-mk" style="left:${pct(e.date)}%" title="${esc(e.label)}">${EV_ICON[e.kind]||"•"}</span>`).join("");
  const now=dnum(t)>=a&&dnum(t)<=b?`<div class="sz-now" style="left:${pct(t)}%"></div>`:"";
  const ph=S.phases.map((p,i)=>{const cur=t>=p.from&&t<=p.to;return `<div class="${cur?"cur":""}"><i style="background:${SZ_COL[i%SZ_COL.length]}"></i><span><b>${esc(p.name)}</b>${cur?" · jetzt":""}<small>${fmtDate(p.from)}–${fmtDate(p.to)} · ${esc(p.focus||"")}</small></span></div>`}).join("");
  const nxt=ev.filter(e=>(e.kind==="deload"?addDays(e.date,6):e.date)>=t).slice(0,5);
  return `<div class="card">${dd("star","corner o")}<h3>Saison bis ${esc(S.race.name)}</h3>
   <div class="sz-count"><div><b>${days}</b><span>Tage</span></div><div><b>${weeks}</b><span>Wochen</span></div><div><b>${fmtDate(S.race.date)}</b><span>${esc(S.race.name)}</span></div></div>
   <div class="sz-bar" role="img" aria-label="Zeitstrahl der Saisonphasen bis ${esc(S.race.name)}">${segs}${dl}${mk}${now}</div>
   <div class="sz-ph">${ph}</div>
   ${nxt.length?`<p class="label" style="margin-top:12px">Nächste Termine</p><ul class="sz-ev">${nxt.map(e=>`<li><span aria-hidden="true">${EV_ICON[e.kind]||"•"}</span><span class="mono">${fmtDate(e.date)}${e.kind==="deload"?"–"+fmtDate(addDays(e.date,6)):""}</span><span>${esc(e.label)}</span></li>`).join("")}</ul>`:""}
   <p class="muted" style="font-size:13px;margin-top:8px">★ Test · ▾ Entlastungswoche · ⚑ Rennen${S.note?" · "+esc(S.note):""}</p></div>`;
}

/* ---------- Belastungskurve: Fitness (42 Tage) und Ermüdung (7 Tage) aus Strava Relative Effort ---------- */
function loadSeries(L){let c=0,a=0;return L.re.map((x,i)=>{c+=(x-c)/42;a+=(x-a)/7;return{d:addDays(L.start,i),re:x,ctl:c,atl:a}})}
function loadCard(){
  const L=PROG&&PROG.load;if(!L||!Array.isArray(L.re)||L.re.length<60)return"";
  const all=loadSeries(L),s=all.slice(-182),last=all.at(-1),form=Math.round(last.ctl-last.atl);
  const peak=all.reduce((m,x)=>x.ctl>m.ctl?x:m,all[0]);
  const fTxt=form<-25?"sehr hohe Ermüdung":form<-10?"im Training belastet":form<=10?"ausgeglichen":"frisch, Fitness sinkt langsam";
  const W=330,H=170,pl=26,pb=16,n=s.length,max=niceMax(Math.max(...s.map(x=>Math.max(x.ctl,x.atl)))*1.05);
  const X=i=>pl+i*(W-pl-34)/(n-1),Y=v=>H-pb-(v/max)*(H-pb-8);
  const path=k=>s.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(x[k]).toFixed(1)}`).join("");
  let xl="";s.forEach((x,i)=>{if(x.d.slice(8)==="01")xl+=`<text x="${X(i).toFixed(1)}" y="${H-3}" text-anchor="middle">${MON[+x.d.slice(5,7)-1]}</text><path d="M${X(i).toFixed(1)} ${H-pb}v3" stroke="var(--muted)"/>`});
  const bw=(W-pl-34)/(n-1);
  const hit=s.map((x,i)=>`<rect x="${(X(i)-bw/2).toFixed(1)}" y="0" width="${bw.toFixed(2)}" height="${H-pb}" fill="transparent" data-tip="${esc(`${fmtDate(x.d)}: Fitness ${Math.round(x.ctl)} · Ermüdung ${Math.round(x.atl)} · Form ${Math.round(x.ctl-x.atl)} · Tagesbelastung ${x.re}`)}"/>`).join("");
  const lab=(k,c,txt)=>`<text x="${(X(n-1)+4).toFixed(1)}" y="${(Y(s.at(-1)[k])+4).toFixed(1)}" style="fill:var(--ink);font-weight:700">${Math.round(s.at(-1)[k])}</text>`;
  const ly=[Y(last.ctl),Y(last.atl)];if(Math.abs(ly[0]-ly[1])<12){}
  return `<div class="card chartcard">${dd("bolt","corner y")}<h3>Belastung</h3>
   <div class="tiles"><div><span class="label">Fitness</span><b>${Math.round(last.ctl)}</b><small class="muted">Höchstwert ${Math.round(peak.ctl)} (${MON[+peak.d.slice(5,7)-1]} ${peak.d.slice(0,4)})</small></div><div><span class="label">Ermüdung</span><b>${Math.round(last.atl)}</b><small class="muted">Schnitt der letzten 7 Tage</small></div><div><span class="label">Form</span><b>${form>0?"+":""}${form}</b><small class="muted">${fTxt}</small></div></div>
   <div class="lkey"><span><i style="background:var(--c-kraft)"></i>Fitness (42 Tage)</span><span><i style="background:var(--c-power)"></i>Ermüdung (7 Tage)</span></div>
   <div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fitness und Ermüdung der letzten 26 Wochen">${chartFrame(W,H,pl,pb,max,[0,Math.round(max/2),max],v=>num(v,0))}${xl}
    <path d="${path("atl")}" fill="none" stroke="var(--c-power)" stroke-width="2" stroke-linejoin="round"/><path d="${path("ctl")}" fill="none" stroke="var(--c-kraft)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(n-1).toFixed(1)}" cy="${Y(last.ctl).toFixed(1)}" r="4" fill="var(--c-kraft)" stroke="var(--surface)" stroke-width="2"/><circle cx="${X(n-1).toFixed(1)}" cy="${Y(last.atl).toFixed(1)}" r="4" fill="var(--c-power)" stroke="var(--surface)" stroke-width="2"/>
    ${lab("ctl")}${Math.abs(ly[0]-ly[1])>=12?lab("atl"):""}${hit}</svg></div>
   <p class="tipline" aria-live="polite">Tipp auf die Kurve für die Werte eines Tages.</p>
   <p class="muted" style="font-size:13px">Grobe Schätzung aus Strava Relative Effort (pulsbasiert), Einheiten ohne Puls nach Dauer geschätzt. Fitness ist der Schnitt der letzten 42 Tage, Ermüdung der letzten 7 Tage, Form ist die Differenz. Wird jeden Sonntag aktualisiert.</p></div>`;
}

/* ---------- Rolle steuern (Wahoo Kickr & andere Smart-Trainer über Bluetooth FTMS) ---------- */
// Workout kommt aus unit.erg: [{d:Sekunden, w:Watt, w1?:Endwatt (Rampe), t:"Text"}]. Aufzeichnung → rides/<id> + TCX (gezippt) für Strava.
const BT={FTMS:0x1826,BIKE:0x2ad2,CP:0x2ad9,CPS:0x1818,CPM:0x2a63,HRS:0x180d,HRM:0x2a37,
  WAHOO_S:"a026ee0b-0a7d-4ab3-97fa-f1500f9feb8b",WAHOO_C:"a026e005-0a7d-4ab3-97fa-f1500f9feb8b"};
let ERG=null;
function ergNew(u,d){const steps=(u.erg||[]).map(s=>({d:Math.max(5,+s.d||60),w:+s.w||100,w1:s.w1!=null?+s.w1:null,t:s.t||""}));
  return{unit:u.title,date:d.date,steps,total:steps.reduce((a,s)=>a+s.d,0),free:!steps.length,manualW:150,off:0,
    dev:null,mode:"",cp:null,wahoo:null,hrDev:null,sim:false,run:false,t:0,last:0,iv:null,
    pw:0,cad:0,hr:0,kmh:0,dist:0,samples:[],lastSent:null,msg:"",phase:"setup",crank:null}}
function ergStepAt(t){const E=ERG;let a=0;for(let i=0;i<E.steps.length;i++){const s=E.steps[i];if(t<a+s.d)return{i,s,into:t-a,left:a+s.d-t};a+=s.d}return null}
function ergTarget(){const E=ERG;if(E.free)return Math.max(50,E.manualW);const x=ergStepAt(E.t);if(!x)return 100;const s=x.s;
  const w=s.w1!=null?s.w+(s.w1-s.w)*(x.into/s.d):s.w;return Math.max(50,Math.round((w+E.off)/5)*5)}

    <div><span class="label">Laufen</span><b>${num(L.run_km||0)} km</b><small>${P?deltaTxt(L.run_km||0,P.run_km||0,"km"):""}</small></div>
    <div><span class="label">Schwimmen</span><b>${num(L.swim_km||0)} km</b><small>${P?deltaTxt(L.swim_km||0,P.swim_km||0,"km"):""}</small></div>

  const legend=`<div class="sportkey">${SP3.map(([sp])=>`<span><i class="spdot" style="background:${SPORT[sp][1]}"></i>${SPORT[sp][0]}</span>`).join("")}</div>`;

  return `${head}
   <div class="card">${dd("bike","corner y")}<h3>Letzte Woche · ${esc(L.label)}</h3>${PROG.updated?`<p class="muted" style="font-size:13px;margin-top:2px">Aus Strava, Stand ${fmtDate(PROG.updated)} · wird jeden Sonntag aktualisiert</p>`:""}${tiles}${PROG.comment?`<div class="coach"><strong>Einordnung von Claude</strong><p>${esc(PROG.comment)}</p></div>`:""}</div>

}
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function monTxt(m){if(!m)return"";const[y,mo]=m.split("-");return MON[+mo-1]+" "+y}
function prevMonth(m){let[y,mo]=m.split("-").map(Number);mo--;if(!mo){mo=12;y--}return y+"-"+String(mo).padStart(2,"0")}
function cmpTxt(t,cur,prev){
  if(typeof cur.n!=="number"||typeof prev.n!=="number")return"";
  const d=cur.n-prev.n;if(Math.abs(d)<1e-9)return`<span class="trend eq">= gleich</span>`;
  const good=t.better==="lower"?d<0:d>0;
  return good?`<span class="trend up">▲ besser</span>`:`<span class="trend dn">▼ schwächer</span>`}
function testsHtml(list){
  if(!list.length)return"";
  const groups=[];list.forEach(t=>{const g=t.group||"Weitere";let G=groups.find(x=>x[0]===g);if(!G)groups.push(G=[g,[]]);G[1].push(t)});
  return groups.map(([g,ts])=>`<div class="tgroup">${esc(g)}</div>`+ts.map(t=>{
    const h=(t.history||[]).filter(x=>x&&x.v),cur=h.at(-1);
    if(!cur)return`<div class="trow"><div><b>${esc(t.label)}</b>${t.hint?`<small>${esc(t.hint)}</small>`:""}</div><div class="tval"><b class="miss">fehlende Information</b></div></div>`;
    const prev=cur.m?[...h].reverse().find(x=>x.m&&x.m<cur.m):h.at(-2);
    const lines=[];
    if(prev){const lbl=cur.m&&prev.m===prevMonth(cur.m)?"Vormonat":"Davor";lines.push(`${lbl} (${esc(prev.m?monTxt(prev.m):prev.when)}): <b>${esc(prev.v)}</b> ${cmpTxt(t,cur,prev)}`)}
    if(t.best&&t.best.v&&t.best.v!==cur.v)lines.push(`Bestwert: <b>${esc(t.best.v)}</b> · ${esc(t.best.when||"")}`);
    else if(t.best&&t.best.v===cur.v)lines.push(`Aktueller Wert ist dein Bestwert`);
    const older=h.filter(x=>x!==cur&&x!==prev).slice(-3);
    if(older.length)lines.push(`Früher: ${older.map(x=>`${esc(x.m?monTxt(x.m):x.when)} ${esc(x.v)}`).join(" · ")}`);
    return`<div class="trow"><div><b>${esc(t.label)}</b>${t.hint?`<small>${esc(t.hint)}</small>`:""}${lines.map(l=>`<small>${l}</small>`).join("")}</div><div class="tval"><b>${esc(cur.v)}</b><small>${esc(cur.when||monTxt(cur.m))}</small></div></div>`}).join("")).join("")}
function showTip(el){const card=el.closest(".chartcard");if(!card)return;const line=card.querySelector(".tipline");if(line){line.textContent=el.dataset.tip;line.classList.add("on")}
  card.querySelectorAll("[data-tip].hl").forEach(x=>x.classList.remove("hl"));el.classList.add("hl")}
document.getElementById("app").addEventListener("mouseover",ev=>{const t=ev.target.closest&&ev.target.closest("[data-tip]");if(t)showTip(t)});
document.getElementById("app").addEventListener("click",ev=>{const t=ev.target.closest&&ev.target.closest("[data-tip]");if(t)showTip(t)});

/* ---------- Render ---------- */
function vRolle(){const t=isoDay(new Date());const items=[];
  (PLAN&&PLAN.weeks||[]).forEach((w,wi)=>w.days.forEach((d,di)=>d.units.forEach((u,ui)=>items.push({ref:wi+"."+di+"."+ui,d,u}))));
  const free=items.filter(x=>!x.d.date),dated=items.filter(x=>x.d.date),up=dated.filter(x=>x.d.date>=t),past=dated.filter(x=>x.d.date<t).reverse();
  const mins=u=>Math.round((u.erg||[]).reduce((a,s)=>a+(+s.d||0),0)/60);
  const row=x=>`<div class="pu${x.d.date===t?" rl-today":""}"><div class="pu-row"><div class="pu-h"><span class="spdot" style="background:var(--s-bike)"></span><b>${esc(x.u.title)}</b></div></div><p class="muted" style="font-size:13px">${x.d.date?(x.d.date===t?"Heute · ":"")+esc(x.d.d||"")+" "+fmtDate(x.d.date):"Watt selbst wählen"}${mins(x.u)?" · "+mins(x.u)+" min":""}</p><button class="ergbtn" data-ergopen="${x.ref}">${x.u.erg&&x.u.erg.length?"Auf der Rolle fahren":"Rolle frei steuern"}</button></div>`;
  return `<div class="card">${dd("bike","corner b")}<h3>Rolle</h3><p class="muted" style="font-size:14px;margin-top:4px">In Bluefy öffnen, Kickr und Pulsgurt im Radraum verbinden. Nach der Fahrt „Für die Coach-App kopieren“ tippen und in der Coach-App bei der Einheit einfügen.</p>
    <div style="margin-top:10px">${up.map(row).join("")||'<p class="muted">Keine geplanten Rolleneinheiten.</p>'}${free.map(row).join("")}</div></div>
    ${savedRidesCard()}
    ${past.length?`<details class="card"><summary><b>Frühere Einheiten</b></summary><div style="margin-top:8px">${past.slice(0,8).map(row).join("")}</div></details>`:""}
    <p class="muted" style="font-size:12px;text-align:center;margin:10px 0 30px">Stand ${esc(PLAN&&PLAN.updated||"")}</p>`}
function render(){
  if(window.EMBED_PLAN){document.querySelector(".top h1").textContent="Kraftplan Rolle";const pp=document.getElementById("phasePill");if(pp)pp.textContent="Radraum";document.getElementById("app").innerHTML=vRolle();return}
  header();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const app=document.getElementById("app");
  app.innerHTML=tab==="plan"?vPlan():tab==="woche"?vWoche():tab==="einheiten"?vEinheiten():tab==="uebungen"?vUebungen():tab==="fortschritt"?vFortschritt():vInfos();
  const s=document.getElementById("libSearch");
  if(s)s.oninput=()=>{libQuery=s.value;const pos=s.selectionStart;render();const n=document.getElementById("libSearch");n.focus();n.setSelectionRange(pos,pos)};
  const bw=document.getElementById("bwForm");
  const fb=document.getElementById("fbForm");
  if(fb){fb.oninput=()=>{FBDRAFT=readFb();const o=document.getElementById("fbFatOut");if(o)o.textContent=FBDRAFT.fatigue};
    fb.onsubmit=ev=>{ev.preventDefault();saveFb(fb.querySelector('button[type="submit"]'))}}
  const ck=document.getElementById("chkForm");
  if(ck){ck.oninput=()=>{CHKDRAFT=readChk();CHK_Q.forEach(([k])=>{const o=document.getElementById("chk_"+k+"_o");if(o)o.textContent=CHKDRAFT[k]});const pv=document.getElementById("chkPrev");if(pv)pv.innerHTML=`Ampel: <b>${LIGHT[chkLight(CHKDRAFT)][0]}</b>`};
    ck.onsubmit=ev=>{ev.preventDefault();saveChk(ck.querySelector('button[type="submit"]'))}}
  if(bw)bw.onsubmit=ev=>{ev.preventDefault();const v=parseFloat(String(document.getElementById("bwIn").value).replace(",","."));if(!(v>30&&v<250))return;ST.body=ST.body.filter(x=>x.d!==today());ST.body.push({d:today(),kg:Math.round(v*10)/10});ST.body=ST.body.slice(-200);persist("prefs");render();roar(`${String(v).replace(".",",")} kg eingetragen`)};
}
document.getElementById("app").addEventListener("submit",ev=>{const f=ev.target.closest&&ev.target.closest("form.revq");if(f){ev.preventDefault();sendRevAnswer(f)}});
document.getElementById("app").addEventListener("click",ev=>{
  const w=ev.target.closest("i[data-w]");if(w){setWeek(+w.dataset.w);return}
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.setweek){setWeek(+t.dataset.setweek);return}
  if(t.dataset.rev!==undefined&&PLAN){sendReview(t.dataset.rev,t);return}
  if(t.dataset.pv){PLANVIEW=t.dataset.pv;render();window.scrollTo(0,0);return}
  if(t.dataset.xadd){openExtra(t.dataset.xadd);return}
  if(t.dataset.ridepaste){openRidePaste(t.dataset.ridepaste);return}
  if(t.dataset.rideshare!==undefined){try{const L=JSON.parse(localStorage.getItem("kp_rides")||"[]");const r=L[+t.dataset.rideshare];if(r)shareRide(r)}catch(e){}return}
  if(t.dataset.ridecopy!==undefined){try{const L=JSON.parse(localStorage.getItem("kp_rides")||"[]");const r=L[+t.dataset.ridecopy];if(r)copyRide(r)}catch(e){}return}
  if(t.dataset.wsay){const f=FB[t.dataset.wsay];if(f&&f.review&&typeof chatSay==="function")chatSay(revText(f.review));return}
  if(t.dataset.xdel){delExtra(t.dataset.xdel);return}
  if(t.dataset.ergopen&&PLAN){openErg(t.dataset.ergopen);return}
  if(t.dataset.tick&&PLAN){const [r,st]=t.dataset.tick.split("|");setTick(r,st);return}
  if(t.dataset.dc){CHKEDIT=t.dataset.dc==="edit";CHKDRAFT=null;render();return}
  if(t.dataset.chg!==undefined&&PLAN){openChange(t.dataset.chg);return}
  if(t.dataset.chgOk){answerChange(t.dataset.chgOk,true);return}
  if(t.dataset.chgNo){answerChange(t.dataset.chgNo,false);return}
  if(t.dataset.go){tab=t.dataset.go;openSession=null;LS.set("kp_tab2",tab);render();window.scrollTo(0,0);return}
  if(t.dataset.open){tab="einheiten";openSession=t.dataset.open;render();window.scrollTo(0,0);return}
  if(t.dataset.sess){openSession=t.dataset.sess;render();window.scrollTo(0,0);return}
  if(t.hasAttribute("data-back")){openSession=null;render();return}
  if(t.dataset.ex){openEx(t.dataset.ex,openSession&&t.dataset.slot!==undefined?{s:openSession,i:+t.dataset.slot}:null);return}
  if(t.dataset.chk){const id=t.dataset.chk,on=!getDone(openSession).includes(id);markDone(openSession,id,on);render();if(on)roar();return}
  if(t.dataset.reset){ST.done[dkey(t.dataset.reset)]=[];persist("prefs");render();return}
  if(t.dataset.cat){libCat=t.dataset.cat;render();return}
});

<div id="chatRoot"></div>
<script>
/* ---------- Coach-Chat: chat/<id> {from:"marcel"|"claude",text,at,threadId?}; Nachricht geht per sendToClaude an den Coach ---------- */
let CHAT={},CHAT_OPEN=false,CHAT_READY=false,CHAT_SEEN=0,CHAT_LASTC=null,CHAT_REC=null,CHAT_HINT="";
try{CHAT_SEEN=+localStorage.getItem("kp_chat_seen")||0}catch(e){}
function chatTTS(){try{return localStorage.getItem("kp_tts")==="1"}catch(e){return false}}
function chatList(){return Object.values(CHAT).sort((a,b)=>String(a.at).localeCompare(String(b.at)))}
function chatClean(t){return String(t||"").replace(/[*_#>`]/g,"").replace(/\s+/g," ").trim()}
function chatSay(text){
  try{const s=window.speechSynthesis;if(!s){roar("Vorlesen geht in diesem Browser nicht.");return}
    s.cancel();const u=new SpeechSynthesisUtterance(chatClean(text));u.lang="de-DE";u.rate=1.02;
    const v=(s.getVoices()||[]).filter(x=>/^de/i.test(x.lang));if(v.length)u.voice=v.find(x=>/Anna|Markus|Helena|Google/i.test(x.name))||v[0];
    s.speak(u)}catch(e){}
}
function chatBadge(){
  const fab=document.querySelector(".cfab");if(!fab)return;
  const n=chatList().filter(m=>m.from==="claude"&&Date.parse(m.at)>CHAT_SEEN).length;
  fab.querySelector("b")?.remove();if(n&&!CHAT_OPEN)fab.insertAdjacentHTML("beforeend",`<b>${n}</b>`);
}
function chatTime(at){const d=new Date(at);if(isNaN(d))return"";const t=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});return isoDay(d)===today()?t:fmtDate(isoDay(d))+" · "+t}
function chatRenderList(){
  const L=document.querySelector(".chat-list");if(!L)return;
  const ms=chatList(),last=ms[ms.length-1];
  L.innerHTML=(ms.length?"":`<p class="chat-empty">Schreib mir hier alles zum Training: Planänderungen, wie es dir geht, Fragen. Du kannst auch diktieren (Mikrofon) und dir meine Antworten vorlesen lassen.</p>`)+
    ms.map(m=>`<div class="cmsg ${m.from==="claude"?"c":"m"}"><small><span>${m.from==="claude"?"Claude":"Du"} · ${chatTime(m.at)}</span>${m.from==="claude"?`<button class="say" data-csay="${esc(m.id)}" aria-label="Vorlesen">🔊</button>`:""}</small>${esc(m.text||"")}${m.failed?`<br><small>Nicht angekommen. Bitte noch einmal senden.</small>`:""}</div>`).join("")+
    (last&&last.from!=="claude"&&!last.failed?`<p class="chat-wait">Claude hat deine Nachricht und antwortet hier. Das dauert meist ein paar Minuten, du kannst die App solange schließen.</p>`:"");
  L.scrollTop=L.scrollHeight;
}
function chatOpen(){
  CHAT_OPEN=true;CHAT_SEEN=Date.now();try{localStorage.setItem("kp_chat_seen",CHAT_SEEN)}catch(e){}
  document.getElementById("chatRoot").innerHTML=`<div class="chat" role="dialog" aria-modal="true" aria-label="Coach-Chat">
    <div class="chat-hd"><h2>Coach-Chat</h2><label class="chat-tts"><input type="checkbox" id="cTts"${chatTTS()?" checked":""}> Vorlesen</label><button class="x" data-cclose aria-label="Schließen">×</button></div>
    <div class="chat-list"></div>
    <div class="chat-in"><form id="cForm"><button type="button" class="mic" data-cmic aria-label="Diktieren">🎤</button><textarea id="cTxt" rows="1" maxlength="2000" placeholder="Nachricht an Claude"></textarea><button class="btn dark" type="submit">Senden</button></form><p class="chat-hint" id="cHint">${esc(CHAT_HINT)}</p></div></div>`;
  document.querySelector(".cfab")?.remove();chatRenderList();
}
function chatClose(){CHAT_OPEN=false;chatMicStop();CHAT_SEEN=Date.now();try{localStorage.setItem("kp_chat_seen",CHAT_SEEN)}catch(e){}document.getElementById("chatRoot").innerHTML="";chatFab()}
function chatFab(){if(!CHAT_READY||CHAT_OPEN||document.querySelector(".cfab"))return;document.getElementById("chatRoot").insertAdjacentHTML("beforeend",`<button class="cfab" data-copen aria-label="Coach-Chat öffnen"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></button>`);chatBadge()}
function chatHint(t){CHAT_HINT=t;const h=document.getElementById("cHint");if(h)h.textContent=t}
function chatMicStop(){try{if(CHAT_REC)CHAT_REC.stop()}catch(e){}CHAT_REC=null;document.querySelector("[data-cmic]")?.classList.remove("on")}
function chatMic(){
  if(CHAT_REC){chatMicStop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fallback="Diktieren direkt in der App geht hier nicht. Tippe ins Textfeld und nutze das Mikrofon auf der iPhone-Tastatur (unten rechts).";
  if(!SR){chatHint(fallback);document.getElementById("cTxt")?.focus();return}
  try{const r=new SR();r.lang="de-DE";r.interimResults=true;r.continuous=true;const ta=document.getElementById("cTxt"),base=ta.value?ta.value.trim()+" ":"";
    r.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;ta.value=base+s};
    r.onerror=e=>{chatMicStop();chatHint(e.error==="not-allowed"||e.error==="service-not-allowed"?fallback:"Diktieren hat nicht geklappt. Versuch es noch einmal oder nutze das Tastatur-Mikrofon.")};
    r.onend=()=>{if(CHAT_REC===r)chatMicStop()};
    r.start();CHAT_REC=r;document.querySelector("[data-cmic]")?.classList.add("on");chatHint("Ich höre zu. Zum Beenden noch einmal aufs Mikrofon tippen.")
  }catch(e){chatHint(fallback)}
}
async function chatSend(){
  const ta=document.getElementById("cTxt"),txt=(ta.value||"").trim();if(!txt){ta.focus();return}
  chatMicStop();const btn=document.querySelector("#cForm .btn");btn.disabled=true;
  const id="c"+Date.now().toString(36),at=new Date().toISOString();
  if(CM&&CAN_SEND!=="available")CAN_SEND=await CM.canSendToClaude().catch(()=>"off");
  const prev=chatList().filter(m=>m.threadId).pop();let threadId=null;
  const text=`Chat ${id} (${fmtDate(today())})\n${txt}`;
  try{if(CM&&CAN_SEND==="available"){
    if(prev){try{threadId=(await CM.sendToClaude({threadId:prev.threadId,text})).threadId||prev.threadId}catch(e){}}
    if(!threadId){const anchor=await CM.anchorFor(document.getElementById("app"));threadId=(await CM.sendToClaude({anchor,text})).threadId}}}catch(e){}
  const doc={id,from:"marcel",text:txt,at};if(threadId)doc.threadId=threadId;else doc.failed=true;
  try{await PDB.collection("chat").doc(id).set(doc)}catch(e){}
  btn.disabled=false;
  if(!threadId){chatHint("Senden hat nicht geklappt. Prüf die Verbindung und versuch es noch einmal.");return}
  ta.value="";chatHint("");
}
function initChat(){
  if(!PDB)return;
  try{PDB.collection("chat").orderBy("at","desc").limit(80).onSnapshot(s=>{
    CHAT={};s.docs.forEach(d=>{CHAT[d.id]=d.data()});
    const lc=chatList().filter(m=>m.from==="claude").pop();
    if(CHAT_OPEN&&lc&&CHAT_LASTC&&lc.id!==CHAT_LASTC&&chatTTS())chatSay(lc.text);
    CHAT_LASTC=lc?lc.id:"-";
    if(CHAT_OPEN){CHAT_SEEN=Date.now();try{localStorage.setItem("kp_chat_seen",CHAT_SEEN)}catch(e){}chatRenderList()}else chatBadge();
  },()=>{})}catch(e){}
  CHAT_READY=true;chatFab();
}
(function waitDb(n){if(typeof PDB!=="undefined"&&PDB){initChat();return}if(n<60)setTimeout(()=>waitDb(n+1),500)})(0);
document.getElementById("chatRoot").addEventListener("click",ev=>{
  const t=ev.target.closest&&ev.target.closest("button,input");if(!t)return;
  if(t.hasAttribute("data-copen")){chatOpen();return}
  if(t.hasAttribute("data-cclose")){chatClose();return}
  if(t.hasAttribute("data-cmic")){chatMic();return}
  if(t.dataset.csay){const m=CHAT[t.dataset.csay];if(m)chatSay(m.text);return}
  if(t.id==="cTts"){try{localStorage.setItem("kp_tts",t.checked?"1":"0")}catch(e){}if(t.checked){chatSay("Vorlesen ist an.")}else{try{speechSynthesis.cancel()}catch(e){}}return}
});
document.getElementById("chatRoot").addEventListener("submit",ev=>{if(ev.target.id==="cForm"){ev.preventDefault();chatSend()}});
document.getElementById("chatRoot").addEventListener("input",ev=>{if(ev.target.id==="cTxt"){ev.target.style.height="auto";ev.target.style.height=Math.min(140,ev.target.scrollHeight)+"px"}});
</script>
