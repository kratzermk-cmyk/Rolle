<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kraftplan Rolle</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Karo-Block-Papier als Grund, weiße „eingeklebte“ Karten mit schwarzer Tuschkante, Filzstift-Kritzeleien am Rand. Bewusst nur ein (helles) Theme – es ist Papier. */
:root{
  color-scheme:light;
  --paper:#FBFBF7; --grid:#C9D8E4; --grid-strong:#AFC4D4;
  --surface:#FFFFFF; --ink:#111111; --muted:#5E646A; --line:#111111; --soft:#E4E7EA;
  --bg:var(--paper); --accent:#111111; --accent-ink:#FFFFFF;
  --c-kraft:#2F6BD8; --c-power:#F07A1A; --c-core:#2E9E4F; --c-mob:#8A55C9;
  --c-yellow:#F4C430; --c-red:#E2402B;
  --tint:#FFF6CF; --ok:#2E9E4F;
  --s-swim:#2F6BD8; --s-bike:#D9A400; --s-run:#E2402B;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-hand:"Caveat","Comic Sans MS","Marker Felt",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  background-position:-1px -1px;
}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:30px;font-weight:900;font-stretch:80%;text-transform:uppercase;letter-spacing:-.01em}
h2{font-size:26px;font-weight:900;font-stretch:78%;text-transform:uppercase;letter-spacing:-.005em}
h3{font-size:20px;font-weight:800;font-stretch:85%;text-transform:uppercase}
p{margin:0}
a{color:var(--ink)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hand{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.1}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}

/* Kritzeleien */
.dd{display:block;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#crayon);overflow:visible}
.dd.thin{stroke-width:3}
.y{color:var(--c-yellow)}.r{color:var(--c-red)}.b{color:var(--c-kraft)}.g{color:var(--c-core)}.o{color:var(--c-power)}.v{color:var(--c-mob)}.k{color:var(--ink)}
.bgd{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgd .dd{position:absolute;opacity:.85}
.swoosh{position:relative;display:inline-block;z-index:0}
.swoosh::after{content:"";position:absolute;left:-4px;right:-6px;bottom:1px;height:10px;z-index:-1;background:var(--c-yellow);opacity:.75;border-radius:40% 60% 50% 50%/60% 40% 60% 40%;transform:rotate(-1deg)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.top-in .t{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.top-in .t>div{min-width:0}
.top-in .t h1{font-size:24px}
.top-in .logo{width:38px;height:38px;flex:none}
.phase-pill{display:block;font-family:var(--f-hand);font-size:19px;font-weight:700;color:var(--c-kraft);line-height:1}
.stepper{display:flex;align-items:center;border:2px solid var(--line);background:var(--surface)}
.stepper button{border:0;background:none;width:36px;height:36px;font-size:22px;cursor:pointer;font-weight:700}
.stepper span{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:18px;min-width:62px;text-align:center;text-transform:uppercase}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 4px 11px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:28%;right:28%;bottom:6px;height:6px;background:var(--c-yellow);border-radius:50%;opacity:.8;z-index:-1}

section.view{display:grid;gap:20px;padding-top:22px}
.card{position:relative;background:var(--surface);border:2px solid var(--line);padding:16px;box-shadow:4px 4px 0 var(--ink)}
.card>.corner{position:absolute;width:62px;height:62px;top:-26px;right:-12px;pointer-events:none}
.stack{display:grid;gap:14px}

/* Phasen-Leiste */
.track{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-top:12px}
.track i{height:28px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-family:var(--f-mono);color:var(--ink);cursor:pointer;background:var(--surface)}
.track i.p0{background:color-mix(in srgb,var(--c-core) 30%,white)}
.track i.p1{background:color-mix(in srgb,var(--c-kraft) 30%,white)}
.track i.p2{background:color-mix(in srgb,var(--c-power) 35%,white)}
.track i.p3{background:color-mix(in srgb,var(--c-mob) 30%,white)}
.track i.dl{background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.18) 4px 5.5px)}
.track i.cur{background:var(--ink);color:#fff;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}

.banner{position:relative;padding:12px 14px 12px 14px;background:var(--tint);border:2px dashed var(--ink);font-size:15px}
.banner strong{display:block;font-family:var(--f-hand);font-size:26px;line-height:1;margin-bottom:4px}

/* Woche */
.day{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-top:1.5px dashed var(--soft)}
.day:first-child{border-top:0}
.day .d{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:22px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border:1.5px solid var(--ink);background:var(--surface);cursor:default}
.chip.s{background:var(--ink);color:#fff;cursor:pointer}
.chip.o{border-style:dashed;cursor:pointer}
ul.rules{margin:0;padding-left:0;list-style:none;display:grid;gap:10px;counter-reset:r}
ul.rules li{position:relative;padding-left:34px;counter-increment:r}
ul.rules li::before{content:counter(r);position:absolute;left:0;top:-2px;width:24px;height:24px;border:2px solid var(--c-red);border-radius:50% 45% 55% 48%;display:flex;align-items:center;justify-content:center;font-family:var(--f-hand);font-size:19px;font-weight:700;color:var(--c-red)}

/* Einheiten */
.sess{position:relative;display:grid;gap:4px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);padding:16px 82px 16px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.sess:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.sess .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sess .meta{font-size:14px;color:var(--muted)}
.sess .dd{position:absolute;right:12px;top:50%;width:60px;height:60px;transform:translateY(-50%) rotate(-6deg)}
.prog{height:8px;border:1.5px solid var(--ink);background:var(--surface);overflow:hidden;margin-top:8px}
.prog>span{display:block;height:100%;background:var(--ok);transition:width .3s}

.back{border:0;background:none;color:var(--ink);font-family:var(--f-hand);font-size:22px;font-weight:700;padding:0;cursor:pointer;justify-self:start}
.ex{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--soft)}
.ex:first-child{border-top:0}
.chk{width:30px;height:30px;border:2px solid var(--ink);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk svg{width:22px;height:22px;stroke:var(--c-core);stroke-width:4;fill:none;opacity:0;filter:url(#crayon)}
.chk[aria-pressed="true"] svg{opacity:1}
.ex .nm{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0}
.ex .nm b{display:block;font-weight:800;font-size:16px}
.ex .nm .rx{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.ex .nm .rs{font-size:13px;color:var(--muted)}
.ex.done .nm b{text-decoration:line-through;text-decoration-color:var(--c-red);text-decoration-thickness:2px;color:var(--muted)}
.ex.off{opacity:.4}
.cat{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.cat.kraft{background:var(--c-kraft)}.cat.power{background:var(--c-power)}.cat.core{background:var(--c-core)}.cat.mob{background:var(--c-mob)}
.ghost{border:2px solid var(--ink);background:var(--surface);padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}

/* Bibliothek */
.search{width:100%;padding:12px 14px;border:2px solid var(--ink);background:var(--surface);font:inherit;color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--ink);background:var(--surface);padding:5px 11px;font-size:14px;font-weight:700;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lib{display:grid;gap:0;padding:4px 16px}
.lib button{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;border:0;border-top:1.5px dashed var(--soft);background:none;padding:12px 0;text-align:left;cursor:pointer}
.lib button:first-child{border-top:0}
.lib small{display:block;color:var(--muted);font-size:13px}
.arrow{font-size:20px;font-weight:700}

/* Detail-Sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-top:2px solid var(--ink);padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.grab{width:46px;height:5px;background:var(--ink);margin:4px auto 12px;border-radius:3px}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.x{border:2px solid var(--ink);background:var(--surface);width:38px;height:38px;font-size:20px;font-weight:700;cursor:pointer;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;color:#fff;border:1.5px solid var(--ink)}
.tag.kraft{background:var(--c-kraft)}.tag.power{background:var(--c-power)}.tag.core{background:var(--c-core)}.tag.mob{background:var(--c-mob)}
.sheet .box{background:var(--surface);border:2px solid var(--ink);padding:12px 14px;margin-top:14px}
.sheet ol,.sheet ul{margin:6px 0 0;padding-left:20px;display:grid;gap:5px}
.vid{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:14px;box-shadow:4px 4px 0 var(--c-yellow)}
.vid svg{width:20px;height:20px;fill:currentColor}
.var{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.var div{background:var(--surface);border:2px solid var(--ink);padding:10px;font-size:14px;min-width:0}
.sheet .deco{position:absolute;right:62px;top:14px;width:46px;height:46px;opacity:.9}
details{border-top:1.5px dashed var(--soft);padding:12px 0}
details:first-of-type{border-top:0}
summary{font-weight:800;cursor:pointer}
details p,details ul{margin-top:8px}
.foot{display:flex;justify-content:center;gap:18px;padding-top:6px}
.foot .dd{width:42px;height:42px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---- v4 Ergänzungen ---- */
.tabs-in{grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:11px;letter-spacing:.03em}
.group-h{font-family:var(--f-hand);font-size:26px;font-weight:700;line-height:1;margin:6px 0 -4px;display:flex;align-items:center;gap:8px}
.group-h .dd{width:34px;height:34px}

/* Dinos */
.dino{display:block;overflow:visible;filter:url(#crayon)}
.hello{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;padding:12px 14px 12px 6px}
.hello .dino{width:118px;height:auto}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 12px;font-family:var(--f-hand);font-size:22px;font-weight:700;line-height:1.1}
.bubble small{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-top:4px;line-height:1.3}
.dinorow{display:flex;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:wrap;padding-top:4px}
.dinorow .dino{width:96px;height:auto}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:10px 6px}
.empty .dino{width:150px;height:auto}
.peek{position:absolute;width:86px;height:auto;right:-8px;bottom:-14px;pointer-events:none}

/* Feuer-Overlay */
.roar{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none}
.roar .inner{pointer-events:auto;display:grid;justify-items:center;gap:2px;background:var(--surface);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 18px 16px;transform-origin:50% 80%;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;max-width:calc(100vw - 40px)}
.roar .dino{width:250px;max-width:100%;height:auto}
.roar b{font-family:var(--f-hand);font-size:40px;line-height:.9;color:var(--c-red)}
.roar span{font-weight:700;font-size:15px}
.roar.out .inner{animation:popout .25s ease-in both}
.flame{transform-box:fill-box;transform-origin:0% 50%;animation:flick .18s ease-in-out infinite alternate}
.flame.f2{animation-duration:.13s}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes popout{to{transform:scale(.6) rotate(6deg);opacity:0}}
@keyframes flick{from{transform:scaleX(.82) scaleY(.9)}to{transform:scaleX(1.12) scaleY(1.06)}}
.spark{position:absolute;font-family:var(--f-hand);font-weight:700;font-size:26px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--tr));opacity:0}}
@media (prefers-reduced-motion: reduce){.roar .inner,.flame,.spark{animation:none!important}}

/* Dinos in Bewegung */
.dino .d-all,.dino .d-bod,.dino .d-eye,.dino .d-arm,.dino .d-legs path,.dino .d-post,.dino .d-pre,.dino .d-wheel{transform-box:view-box}
.dino .d-bod{transform-origin:60px 70px;animation:d-breathe 3.4s ease-in-out infinite}
.dino .d-eye{transform-origin:92px 27px;animation:d-blink 5s infinite}
.dino .d-arm{transform-origin:80px 52px;animation:d-wave 4s ease-in-out infinite}
@keyframes d-breathe{0%,100%{transform:none}50%{transform:translateY(-1.6px) scale(1.012)}}
@keyframes d-blink{0%,93%,100%{transform:none}95.5%{transform:scaleY(.1)}}
@keyframes d-wave{0%,72%,100%{transform:none}78%{transform:rotate(-28deg)}84%{transform:rotate(4deg)}90%{transform:rotate(-22deg)}}
.v-run .d-all{animation:d-hop .36s ease-in-out infinite alternate}
.v-run .l1{transform-origin:48px 72px;animation:d-leg .36s ease-in-out infinite alternate}
.v-run .l2{transform-origin:66px 70px;animation:d-leg .36s ease-in-out infinite alternate-reverse}
.v-run .d-pre{animation:d-whoosh .5s linear infinite}
.v-run .d-post{transform-origin:80px 23px;animation:d-band .25s ease-in-out infinite alternate}
@keyframes d-hop{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes d-leg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes d-whoosh{0%{transform:translateX(6px);opacity:0}30%{opacity:1}100%{transform:translateX(-8px);opacity:0}}
@keyframes d-band{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.v-bike .d-wheel{animation:d-spin .7s linear infinite}
.v-bike .d-all{animation:d-hop .7s ease-in-out infinite alternate}
.v-bike .d-legs{transform-box:view-box;transform-origin:58px 70px;animation:d-pedal .35s ease-in-out infinite alternate}
@keyframes d-spin{to{transform:rotate(360deg)}}
@keyframes d-pedal{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.v-swim .d-all{animation:d-float 1.8s ease-in-out infinite}
.v-swim .d-post{animation:d-sway 1.8s ease-in-out infinite}
@keyframes d-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2.5px) rotate(-1.5deg)}}
@keyframes d-sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
.v-sleep .d-bod{animation-duration:5s}
.v-sleep .d-arm{animation:none}
.v-sleep .d-post text{animation:d-zz 2.6s ease-out infinite}
.v-sleep .d-post text+text{animation-delay:1.3s}
@keyframes d-zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-8px);opacity:0}}
.v-kb .d-arm,.v-kb .d-post{transform-origin:80px 52px;animation:d-swing 1.4s ease-in-out infinite alternate}
@keyframes d-swing{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.v-flex .d-arm{animation:d-flex 1.2s ease-in-out infinite}
.v-flex .d-post{transform-origin:108px 16px;animation:d-twinkle 1.6s ease-in-out infinite}
@keyframes d-flex{0%,100%{transform:none}50%{transform:rotate(-14deg) scale(1.08)}}
@keyframes d-twinkle{0%,100%{transform:scale(.8) rotate(0);opacity:.7}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
.dino.jump .d-all{animation:d-jump .6s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes d-jump{0%{transform:none}30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
.dino:not(.roar .dino){cursor:pointer}
@media (prefers-reduced-motion: reduce){.dino *{animation:none!important}}
/* Abbildungen */
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:14px}
.frame{background:var(--surface);border:2px solid var(--ink);padding:4px 4px 6px;min-width:0}
.frame svg{display:block;width:100%;height:auto;overflow:visible}
.frame p{font-size:12.5px;line-height:1.25;font-weight:600;padding:0 3px;display:flex;gap:5px}
.frame p i{font-style:normal;flex:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-hand);font-size:15px;line-height:1;margin-top:-1px}
.src{font-size:13px;margin-top:10px}
.src a{font-weight:700}

/* Alternativen */
.alts{display:grid;gap:8px;margin-top:6px}
.alt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:2px dashed var(--ink);padding:10px 12px}
.alt b{display:block}
.alt .tg{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--c-yellow);border:1.5px solid var(--ink);padding:0 6px;margin-bottom:3px}
.alt p{font-size:14px;color:var(--muted);margin-top:2px}
.alt .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn{border:2px solid var(--ink);background:var(--surface);padding:7px 10px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center;white-space:nowrap}
.btn.dark{background:var(--ink);color:#fff}
.btn.big{padding:12px 14px;font-size:15px;text-transform:uppercase;letter-spacing:.05em;box-shadow:4px 4px 0 var(--c-yellow)}
.swapchip{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--c-yellow);border:1.5px solid var(--ink);padding:0 5px;margin-left:4px;vertical-align:2px}

/* Logger */
.logbox{background:var(--surface);border:2px solid var(--ink);padding:12px 14px;margin-top:14px;box-shadow:4px 4px 0 var(--c-core)}
.logbox h3{display:flex;align-items:center;gap:8px}
.last{font-size:14px;color:var(--muted);margin-top:2px}
.sets{display:grid;gap:6px;margin-top:10px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 32px;gap:8px;align-items:center}
.setrow .n{font-family:var(--f-hand);font-size:22px;font-weight:700;text-align:center}
.setrow label{display:flex;align-items:center;border:2px solid var(--ink);background:var(--paper);min-width:0}
.setrow input{width:100%;min-width:0;border:0;background:transparent;font:inherit;font-family:var(--f-mono);font-size:16px;padding:8px 6px;color:var(--ink)}
.setrow label span{padding-right:8px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--muted)}
.setrow .rm{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.bwline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:8px 10px;background:var(--tint);border:1.5px dashed var(--ink);font-size:14px}
.bwline .bw-t{flex:1;min-width:180px}.bwline small{color:var(--muted)}
.bwq{display:flex;gap:8px;width:100%}.bwq[hidden]{display:none}
.bwq label{flex:1;display:flex;align-items:center;border:2px solid var(--ink);background:var(--paper)}
.bwq input{width:100%;border:0;background:transparent;font-family:var(--f-mono);font-size:16px;padding:8px 6px;color:var(--ink)}
.bwq label span{padding-right:8px;font-size:12px;font-weight:700;color:var(--muted)}
.timerbox.ck{box-shadow:4px 4px 0 var(--c-yellow)}
.timerbox[data-ph="go"] .bar{stroke:var(--ok)}
.logacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist{margin-top:10px;font-size:14px;display:grid;gap:3px}
.hist div{display:flex;justify-content:space-between;gap:10px;border-top:1.5px dashed var(--soft);padding-top:3px}
.hist .mono{font-size:12.5px}
.lastline{display:block;font-size:12.5px;color:var(--c-core);font-weight:700}

/* Fortschritt */
.stat{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:8px}
.stat div b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:30px;line-height:1}
.stat div span{font-size:13px;color:var(--muted)}
.bwform{display:flex;gap:8px;margin-top:10px}
.bwform label{flex:1;display:flex;align-items:center;border:2px solid var(--ink);background:var(--paper)}
.bwform input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-family:var(--f-mono);padding:9px 8px;color:var(--ink)}
.bwform label span{padding-right:8px;font-weight:700;color:var(--muted)}
.chart{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;border:0;border-top:1.5px dashed var(--soft);background:none;padding:10px 0;text-align:left;cursor:pointer;width:100%}
.prow:first-child{border-top:0}
.prow b{display:block}
.prow small{display:block;font-size:13px;color:var(--muted)}
.prow svg{width:92px;height:34px;overflow:visible}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--c-core);display:inline-block}
.sync.local i{background:var(--c-power)}
.comeback{position:relative;background:var(--tint);border:2px solid var(--ink);padding:12px 14px 12px 104px;min-height:110px;box-shadow:4px 4px 0 var(--c-red)}
.comeback .dino{position:absolute;left:4px;bottom:6px;width:96px;height:auto}
.comeback strong{display:block;font-family:var(--f-hand);font-size:27px;line-height:1}
.comeback p{margin-top:4px;font-size:15px}
.comeback .btn{margin-top:8px}
@media (max-width:380px){.comeback{padding-left:14px;padding-top:96px}.comeback .dino{top:4px;bottom:auto}}

/* Stoppuhr für Halte-Übungen */
.tmchip{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--surface);border:1.5px solid var(--c-power);color:var(--c-power);padding:0 5px;margin-left:6px;vertical-align:1px}
.timerbox{background:var(--surface);border:2px solid var(--ink);padding:12px 14px 14px;margin-top:14px;box-shadow:4px 4px 0 var(--c-power)}
.timerbox h3{display:flex;align-items:center;gap:8px}
.timerbox h3 .snd{margin-left:auto;border:2px solid var(--ink);background:var(--surface);width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
.tm-face{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center;margin-top:10px}
.tm-ring{position:relative;width:128px;height:128px}
.tm-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.tm-ring .trk{fill:none;stroke:var(--soft);stroke-width:10}
.tm-ring .bar{fill:none;stroke:var(--c-core);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timerbox[data-ph="ready"] .bar{stroke:var(--c-power)}
.timerbox[data-ph="rest"] .bar{stroke:var(--c-yellow)}
.tm-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:40px;font-variant-numeric:tabular-nums}
.tm-lbl{font-family:var(--f-hand);font-size:27px;font-weight:700;line-height:1}
.tm-sub{font-size:13px;color:var(--muted);margin-top:3px}
.tm-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tm-dots i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%}
.tm-dots i.on{background:var(--c-core)}
.tm-dots i.cur{background:var(--c-yellow)}
.tm-adj{display:flex;gap:6px;margin-top:8px}
.tm-adj .btn{padding:4px 9px}
.tm-acts{display:flex;gap:8px;margin-top:12px}
.tm-acts .btn.big{flex:1;box-shadow:4px 4px 0 var(--c-power)}
.timerbox.flash{animation:tmflash .5s ease-out 3}
@keyframes tmflash{0%{background:var(--c-yellow)}100%{background:var(--surface)}}
@media (prefers-reduced-motion: reduce){.timerbox.flash{animation:none;background:var(--tint)}}

/* ---- Gesamtplan (Ausdauer + Kraft) & Rückmeldung ---- */
.tabs-in{grid-template-columns:repeat(6,1fr)}
.tabs button{font-size:10.5px;letter-spacing:.02em;padding-inline:2px}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:44px}
.pday{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:10px 0;border-top:1.5px dashed var(--soft)}
.pday:first-child{border-top:0}
.pday .d{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:22px;text-transform:uppercase;line-height:1}
.pday .d small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:none;margin-top:3px}
.pday.today{background:var(--tint);margin-inline:-16px;padding-inline:16px}
.pday.today .d::after{content:"heute";display:block;font-family:var(--f-hand);font-size:19px;color:var(--c-red);text-transform:none;font-weight:700;margin-top:2px}
.pday.past>.d,.pday.past .pu>p,.pday.past .pu-row{opacity:.5}
.units{display:grid;gap:8px;min-width:0}
.pu p{font-size:14px;color:var(--muted);margin-top:1px}
.pu p.why{color:var(--ink);font-size:14px;margin-top:3px}
.pu p.why b{color:var(--c-core)}
.pu-h{display:flex;align-items:center;gap:8px;font-size:16px;min-width:0}
.pu-h b{font-weight:800}
button.pu-h{border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%}
button.pu-h b{text-decoration:underline;text-decoration-color:var(--c-core);text-decoration-thickness:2px;text-underline-offset:3px}
.pu-h .arrow{margin-left:auto}
.spdot{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.sportkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.sportkey span{display:inline-flex;align-items:center;gap:5px}
.zones{display:grid;margin-top:6px}
.zrow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1.5px dashed var(--soft)}
.zrow:first-child{border-top:0}
.zrow .mono{text-align:right}
ul.plain{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.fb{display:grid;gap:14px;margin-top:10px}
.fb .f{display:grid;gap:5px;font-weight:700;font-size:14px}
.fb textarea,.fb input[type=text]{width:100%;border:2px solid var(--ink);background:var(--paper);font:inherit;font-size:16px;font-weight:400;padding:8px 10px;color:var(--ink);resize:vertical}
.fb textarea{min-height:60px}
.fb .range{display:flex;align-items:center;gap:12px}
.fb input[type=range]{flex:1;min-width:0;accent-color:var(--c-red)}
.fb output{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:30px;min-width:30px;text-align:center}
.fb .hint{font-weight:400;color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1.5px solid var(--ink);background:var(--surface);padding:6px 14px;font-weight:700;font-size:14px}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:2px dashed var(--ink);outline-offset:2px}
.fbsent{font-size:14px;color:var(--c-core);font-weight:700;margin-top:4px}
.coach{background:var(--tint);border:2px solid var(--ink);padding:10px 12px;margin-top:10px}
.coach strong{display:block;font-family:var(--f-hand);font-size:24px;line-height:1}
.coach p{white-space:pre-wrap;margin-top:4px;font-size:15px}
.wrev h4{margin:12px 0 2px;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.wrev ul{margin:2px 0 0;padding-left:20px;display:grid;gap:4px;font-size:15px}
.wrev .wsay{float:right;border:2px solid var(--ink);background:var(--surface);font-size:16px;padding:2px 8px;cursor:pointer}
.fbpast{margin-top:10px}
.fbpast details{padding:10px 0}
.fbpast dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:8px 0 0;font-size:14px}
.fbpast dt{color:var(--muted)}
.fbpast dd{margin:0;white-space:pre-wrap}
.pu-row{display:flex;align-items:center;gap:8px;min-width:0}
.pu-row .pu-h{flex:1}
.pu-edit{flex:none;border:1.5px solid var(--ink);background:var(--surface);width:32px;height:32px;font-size:15px;cursor:pointer;line-height:1}
.pu-add{justify-self:start;border:1.5px dashed var(--ink);background:none;padding:3px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.revbtn{margin-top:6px;border:1.5px solid var(--ink);background:var(--surface);font:inherit;font-weight:800;font-size:13px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.revbtn::before{content:"";width:9px;height:9px;background:var(--c-power);transform:rotate(45deg);flex:none}
.rev{margin-top:6px;border:1.5px solid var(--ink);background:var(--tint);padding:8px 10px}
.rev p{margin:4px 0 0;font-size:14px}
.rev.wait{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;background:var(--surface)}
.revdot{width:10px;height:10px;border-radius:50%;background:var(--c-power);animation:revp 1s ease-in-out infinite alternate;flex:none}
@keyframes revp{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
.rev-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.revstats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.revstats span{display:grid}.revstats small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}.revstats b{font-variant-numeric:tabular-nums}
.rev .pu-add{margin-top:6px}
.planseg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);margin:0 0 10px;background:var(--surface)}
.planseg button{font:inherit;font-weight:800;font-size:14px;padding:8px 6px;border:0;background:none;color:var(--ink);cursor:pointer}
.planseg button[aria-selected="true"]{background:var(--ink);color:var(--paper,#fff)}
.todaycard{border-width:3px}
.ridegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.xtag{background:var(--surface)}
.rtalk{margin-top:8px;border-top:1.5px dashed var(--ink);padding-top:6px}
.rmsg{margin-top:6px;padding:6px 8px;border:1.5px solid var(--ink);background:var(--surface)}
.rmsg.m{margin-left:18px}
.rmsg.c{margin-right:18px;background:var(--tint)}
.rmsg small{font-weight:800;font-size:11.5px;color:var(--muted)}
.rmsg p{margin:2px 0 0;font-size:14px}
.revq{display:grid;gap:6px;margin-top:6px}
.revq .f{display:grid;gap:4px;font-weight:700;font-size:14px}
.revq .hint{display:block;font-weight:400}
.revq textarea{width:100%;font:inherit;font-weight:400;font-size:16px;border:1.5px solid var(--ink);padding:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.revq .btn{justify-self:start}
@media (prefers-reduced-motion: reduce){.revdot{animation:none}}
.pend{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--c-yellow);border:1.5px solid var(--ink);padding:0 5px;margin-top:3px}
.chg{border-top:1.5px dashed var(--soft);padding:10px 0;display:grid;gap:4px}
.chg:first-of-type{border-top:0}
.chg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.chg p.muted{font-size:14px}
.tag-st{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid var(--ink);padding:0 6px;background:var(--surface)}
.st-vorschlag{background:var(--c-yellow)}
.st-übernommen{background:color-mix(in srgb,var(--c-core) 30%,white)}

/* Ausdauer-Fortschritt */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.tiles>div{border:2px solid var(--ink);background:var(--paper);padding:8px 10px;min-width:0}
.tiles b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tiles small{display:block;font-size:12.5px;margin-top:2px}
.tiles .up{color:var(--c-core);font-weight:700}.tiles .down{color:var(--c-red);font-weight:700}
.chartcard .sportkey{margin-top:6px}
.chartwrap{min-width:0}
.mini-t{font-size:13px;font-weight:700;margin-top:12px}
.chart [data-tip]{cursor:pointer}
.chart [data-tip].hl{fill:rgba(17,17,17,.07)}
.tipline{font-size:13px;color:var(--muted);margin-top:6px;min-height:2.6em}
.tipline.on{color:var(--ink);font-weight:600}
.tbl{margin-top:6px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--soft);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1.5px dashed var(--soft)}
.trow:first-child{border-top:0}
.trow small{display:block;font-size:12.5px;color:var(--muted)}
.tval{text-align:right}
.tgroup{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.tgroup+.trow{border-top:0}
.trow small b{color:var(--ink);font-weight:700}
.trend{font-weight:700;white-space:nowrap}.trend.up{color:#1E7A3A}.trend.dn{color:#B42A18}.trend.eq{color:var(--muted)}
.tval b.miss{font-family:var(--f-body);font-size:14px;font-weight:700;font-stretch:normal;color:var(--muted)}

.tval b{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:22px}
.sel{width:100%;border:2px solid var(--ink);background:var(--paper);font:inherit;font-size:16px;font-weight:400;padding:8px 10px;color:var(--ink)}


/* Tages-Check */
.dc-light{display:flex;align-items:center;gap:12px;margin-top:10px;border:2px solid var(--ink);padding:10px 12px;background:var(--paper)}
.dc-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);flex:none}
.dc-light b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:24px;line-height:1}
.dc-light p{margin:3px 0 0;font-size:14px}
.dc-vals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.dc-vals b{color:var(--ink);font-variant-numeric:tabular-nums}
.dc-strip{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dc-strip span{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.dc-strip i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:var(--ink)}
.dc-q .range output{font-size:26px}
/* Häkchen */
.ticks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ticks button{border:1.5px solid var(--ink);background:var(--surface);font:inherit;font-size:12.5px;font-weight:800;padding:3px 9px;cursor:pointer;color:var(--ink)}
.ticks button[aria-pressed="true"].t-done{background:var(--c-core);color:#fff}
.ticks button[aria-pressed="true"].t-changed{background:var(--c-yellow)}
.ticks button[aria-pressed="true"].t-missed{background:var(--c-red);color:#fff}
.pu.st-done .pu-h b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--c-core)}
.kq{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;border:1.5px solid var(--ink);padding:3px 9px;background:var(--paper)}
.kbars{display:grid;gap:6px;margin-top:10px}
.kbar{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.kbar .tr{height:14px;background:var(--soft);position:relative}
.kbar .tr i{position:absolute;inset:0 auto 0 0;border-right:2px solid var(--surface)}
.kbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kbar .v small{font-weight:400;color:var(--muted)}
/* Saison */
.sz-count{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.sz-count b{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.sz-count span{font-size:13px;color:var(--muted);display:block}
.sz-bar{position:relative;height:30px;margin:26px 0 22px;border:2px solid var(--ink);background:var(--surface)}
.sz-seg{position:absolute;top:0;bottom:0;border-right:2px solid var(--surface)}
.sz-dl{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.85) 0 3px,transparent 3px 6px)}
.sz-mk{position:absolute;top:-22px;transform:translateX(-50%);font-size:15px;line-height:1}
.sz-now{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink)}
.sz-now::after{content:"heute";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-family:var(--f-hand);font-size:17px;font-weight:700;color:var(--c-red);white-space:nowrap}
.sz-ph{display:grid;gap:0;margin-top:4px}
.sz-ph div{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:8px 0;border-top:1.5px dashed var(--soft);font-size:14px}
.sz-ph div:first-child{border-top:0}
.sz-ph i{width:14px;height:14px;margin-top:3px;border:1.5px solid var(--ink)}
.sz-ph .cur{background:var(--tint);margin-inline:-16px;padding-inline:16px}
.sz-ph small{display:block;color:var(--muted);font-size:12.5px}
.sz-ev{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.sz-ev li{display:grid;grid-template-columns:18px 104px 1fr;gap:6px;align-items:baseline}
.sz-ev .mono{color:var(--muted);white-space:nowrap;font-size:12px}
/* Belastung */
.lkey{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.lkey span{display:inline-flex;align-items:center;gap:6px}
.lkey i{width:16px;height:3px;border-radius:2px;display:inline-block}

/* Rolle (ERG) */
.ergbtn{margin-top:6px;border:2px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.ergbtn::before{content:"";width:0;height:0;border-left:9px solid var(--c-yellow);border-top:6px solid transparent;border-bottom:6px solid transparent}
#ergRoot:empty{display:none}
/* Radraum (ERG) – dunkles Design */
.erg{--zc:#5B8DEF;position:fixed;inset:0;z-index:40;overflow:auto;color:#F3F1EA;background:#141414;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:24px 24px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.erg::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 30% 35%,var(--zc),transparent 55%);opacity:.18;transition:background .8s}
.erg>*{position:relative}
.erg .btn{background:#1f1f1f;color:#F3F1EA;border-color:#F3F1EA}
.erg .btn.dark{background:#F3F1EA;color:#111}
.erg .btn.big{box-shadow:4px 4px 0 var(--zc)}
.erg .btn:disabled{opacity:.4}
.erg .label{color:#A8A8A0}
.erg .muted{color:#A8A8A0}
.erg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.erg-h h2{margin:0;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:24px;text-transform:uppercase;line-height:1.05}
.erg-h h2 small{display:block;font-family:var(--f-hand);font-size:20px;text-transform:none;color:var(--zc);font-weight:700;transition:color .8s}
.erg-dev{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erg-dev .st{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.erg-dev .st i{width:10px;height:10px;border-radius:50%;background:#444;border:1.5px solid #F3F1EA}
.erg-dev .st.on i{background:#3FBF66;box-shadow:0 0 8px #3FBF66}
.erg-dev .st.half i{background:#F4C430;box-shadow:0 0 8px #F4C430;animation:erg-blink 1s ease-in-out infinite alternate}
.erg-dev .st.sim i{background:#5B8DEF}
.erg-msg.ok{border-color:#3FBF66!important;background:rgba(63,191,102,.12)!important}
@keyframes erg-blink{to{opacity:.35}}
.erg-msg{font-size:14px;border:2px solid #E2402B;background:#2a1512;padding:8px 10px;margin:0}
.erg-msg:empty{display:none}
.erg-main{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){.erg-main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.erg-panel{border:2px solid #F3F1EA;background:rgba(20,20,20,.75);padding:12px}
/* Leistungsring */
.erg-ring{display:grid;place-items:center;position:relative}
.erg-ring svg{width:min(100%,340px);height:auto;display:block}
.erg-ring .trk{stroke:#2c2c2c}
.erg-ring .arc{stroke:var(--ac,#3FBF66);transition:stroke-dashoffset .9s cubic-bezier(.3,.7,.3,1),stroke .4s;filter:drop-shadow(0 0 6px var(--ac,#3FBF66))}
.erg-ring .tick{stroke:#F3F1EA}
.erg-ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.erg-ring .mid b{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:clamp(64px,13vw,104px);line-height:.9;font-variant-numeric:tabular-nums}
.erg-ring .mid span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#A8A8A0}
.erg-ring .mid .tg{margin-top:6px;font-size:17px;font-weight:800;color:var(--zc);letter-spacing:0;text-transform:none;transition:color .8s}
.erg-ring .mid .tg.bump{animation:erg-bump .6s ease}
@keyframes erg-bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.erg-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.erg-mini div{text-align:center;border-top:2px solid #333;padding-top:6px;min-width:0}
.erg-mini b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.erg-mini span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A8A8A0}
.erg-mini .hr b{color:#F07A7A}
.erg-mini .hr.beat b{animation:erg-beat var(--hb,.8s) ease-in-out infinite}
@keyframes erg-beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
/* Szene mit Dino */
.erg-scene{position:relative;height:150px;overflow:hidden;border:2px solid #F3F1EA;background:linear-gradient(#1d2733,#2a2318)}
.erg-scene .sky,.erg-scene .hills,.erg-scene .hills2,.erg-scene .road{position:absolute;left:0;right:0}
.erg-scene .sky{top:0;height:60%;background-image:radial-gradient(circle at 20px 22px,rgba(255,255,255,.55) 0 1.5px,transparent 2px),radial-gradient(circle at 140px 48px,rgba(255,255,255,.35) 0 1px,transparent 1.5px);background-size:240px 70px;animation:erg-move var(--sk,60s) linear infinite}
.erg-scene .hills2{bottom:34px;height:60px;background:radial-gradient(ellipse 90px 50px at 90px 60px,#2f3b2a 98%,transparent 100%) 0 0/180px 60px repeat-x;animation:erg-move var(--h2,24s) linear infinite;opacity:.9}
.erg-scene .hills{bottom:30px;height:44px;background:radial-gradient(ellipse 60px 34px at 60px 44px,#3d5a32 98%,transparent 100%) 0 0/130px 44px repeat-x;animation:erg-move var(--h1,12s) linear infinite}
.erg-scene .road{bottom:0;height:32px;background:#333;border-top:2px solid #F3F1EA}
.erg-scene .road::after{content:"";position:absolute;left:0;right:0;top:14px;height:3px;background:repeating-linear-gradient(90deg,#F4C430 0 26px,transparent 26px 56px) 0 0/56px 3px;animation:erg-dash var(--rd,.6s) linear infinite}
@keyframes erg-move{to{background-position-x:-720px}}
@keyframes erg-dash{to{background-position-x:-56px}}
.erg-scene .dino{position:absolute;left:50%;bottom:10px;width:150px;transform:translateX(-50%);filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.erg-scene .v-bike .d-legs{animation-duration:var(--pd,.35s)}
.erg-scene .v-bike .d-wheel{animation-duration:var(--wd,.7s)}
.erg-scene .v-bike .d-all{animation-duration:var(--pd,.35s)}
.erg-scene .sweat{position:absolute;left:calc(50% + 40px);bottom:96px;font-size:16px;opacity:0}
.erg-scene.hard .sweat{animation:erg-sweat 1.2s ease-out infinite}
@keyframes erg-sweat{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(18px,22px);opacity:0}}
.erg.paused .erg-scene *,.erg.paused .erg-scene::after,.erg.paused .erg-scene .road::after{animation-play-state:paused!important}
.erg-zone{position:absolute;top:8px;left:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--zc);color:#111;padding:3px 8px;transition:background .8s}
/* Intervall */
.erg-int .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.erg-int .nm{font-size:19px;font-weight:800}
.erg-int .t{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:clamp(54px,10vw,88px);line-height:.95;font-variant-numeric:tabular-nums}
.erg-int .t.last{color:#F4C430;animation:erg-pulse 1s ease-in-out infinite}
@keyframes erg-pulse{50%{opacity:.35}}
.erg-int .pb{height:10px;background:#2c2c2c;margin-top:8px;overflow:hidden}
.erg-int .pb i{display:block;height:100%;width:0;background:var(--zc);transition:width 1s linear,background .8s}
.erg-int .nx{font-size:14px;color:#A8A8A0;margin-top:8px}
.erg-int .nx b{color:#F3F1EA}
/* Profil */
.erg-bar{position:relative;height:70px;display:flex;align-items:flex-end;gap:2px;margin-top:4px}
.erg-bar span{display:block;opacity:.35;border-radius:3px 3px 0 0;transition:opacity .5s}
.erg-bar span.done{opacity:.85}
.erg-bar span.cur{opacity:1;animation:erg-glow 1.6s ease-in-out infinite}
@keyframes erg-glow{50%{filter:brightness(1.35)}}
.erg-bar .now{position:absolute;top:-4px;bottom:0;width:3px;background:#F3F1EA;box-shadow:0 0 8px #fff;transition:left 1s linear}
.erg-bar .now::before{content:"";position:absolute;top:-6px;left:-5px;border:6.5px solid transparent;border-top-color:#F3F1EA}
.erg-trace{width:100%;height:80px;display:block;margin-top:8px}
.erg-trace .tl{stroke:#F3F1EA;stroke-dasharray:4 4;opacity:.6}
.erg-trace .pl{stroke:var(--zc);transition:stroke .8s}
.erg-meta{display:flex;justify-content:space-between;font-size:13px;color:#A8A8A0;margin-top:4px;font-family:var(--f-mono)}
.erg-adj{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.erg-adj .btn{padding:8px 14px;font-size:16px}
.erg-adj .off{font-family:var(--f-mono);min-width:56px;text-align:center}
.erg-acts{display:flex;gap:8px;flex-wrap:wrap}
.erg-acts .btn{flex:1;min-width:120px;padding:14px 10px;font-size:15px}
.erg-banner{position:fixed;left:50%;top:18%;transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;z-index:45;background:var(--zc);color:#111;border:3px solid #111;box-shadow:6px 6px 0 #111;padding:14px 22px;text-align:center;transition:opacity .3s,transform .3s}
.erg-banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
.erg-banner b{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:34px;text-transform:uppercase;line-height:1}
.erg-banner span{font-size:16px;font-weight:700}
.erg-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.erg-sum div{border:2px solid #F3F1EA;background:rgba(20,20,20,.75);padding:8px 10px}
.erg-sum b{display:block;font-size:28px;font-family:var(--f-display);font-weight:900;font-stretch:80%}
.erg-done{display:grid;place-items:center}
.erg-done .dino{width:200px}
/* Zonen-Ring, Intervall-Ansage, Feuer */
.erg>*{z-index:1}
.erg-ring .zs{opacity:.28;transition:opacity .4s}
.erg-ring .zs.cur{opacity:.6}
.erg-ring .disc{transition:fill .8s}
.erg-ring .tgl{stroke:#F3F1EA;stroke-width:5;stroke-linecap:round;transition:all .9s cubic-bezier(.3,.7,.3,1)}
.erg-ring .mid .dv{font-size:13px;font-weight:800;margin-top:2px;letter-spacing:0;text-transform:none}
.erg-ring .mid .dv.ok{color:#3FBF66}.erg-ring .mid .dv.lo{color:#5B8DEF}.erg-ring .mid .dv.hi{color:#F07A1A}
.erg-zlg{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:11px;color:#A8A8A0;margin-top:4px}
.erg-zlg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.erg-banner.pre{background:#141414;color:#F3F1EA;border-color:#F4C430;box-shadow:6px 6px 0 #F07A1A}
.erg-banner.pre b{font-size:22px}
.erg-banner .cd{display:block;font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:64px;line-height:1;color:#F4C430;margin:2px 0}
.erg-banner.pre .cd{animation:erg-tick 1s ease-out infinite}
@keyframes erg-tick{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.erg-fire{position:fixed;left:0;right:0;bottom:0;height:42vh;z-index:0!important;pointer-events:none;opacity:0;transition:opacity .9s}
.erg.fire .erg-fire{opacity:1}
.erg-fire svg{width:100%;height:100%;display:block}
.erg-fire .fl{transform-box:fill-box;transform-origin:50% 100%;animation:erg-flick var(--fd,.5s) ease-in-out infinite alternate}
@keyframes erg-flick{0%{transform:scaleY(.82) skewX(-3deg)}100%{transform:scaleY(1.08) skewX(3deg)}}
.erg-fire .em{animation:erg-ember var(--ed,2.4s) linear infinite;opacity:0}
@keyframes erg-ember{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-240px) translateX(var(--ex,10px));opacity:0}}
.erg.fire::before{background:radial-gradient(ellipse at 50% 100%,#F07A1A,transparent 60%);opacity:.35}
.erg.fire .erg-panel{background:rgba(20,20,20,.82)}
.erg.paused .erg-fire *{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){.erg-fire *{animation:none!important}}
/* Raketen */
.rocket{position:fixed;left:0;top:0;width:86px;height:auto;pointer-events:none;z-index:30;will-change:transform}
.rocket .rf{transform-box:fill-box;transform-origin:100% 50%;animation:rk-fl .09s linear infinite alternate}
@keyframes rk-fl{from{transform:scaleX(.75)}to{transform:scaleX(1.15)}}
.erg .rocket{z-index:2;width:64px}
@media (prefers-reduced-motion: reduce){.rocket{display:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:46;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;animation:erg-fall linear forwards}
@keyframes erg-fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){.erg *,.erg::before,.erg-banner,.confetti{animation:none!important;transition:none!important}}
</style>

const CATS={kraft:"Kraft",power:"Power & Sprünge",core:"Rumpf & Stabilität",mob:"Mobility & Athletik"};
const EX={
 trapdl:{n:"Trap-Bar-Kreuzheben",c:"kraft",m:"Gesäß, Oberschenkel, Rücken",why:"Die Basisübung für die gesamte hintere Kette. Mehr Kraft hier bedeutet mehr Vortrieb beim Laufen und mehr Druck in der Zugphase am Rad. Die Trap-Bar (sechseckige Stange) ist rückenfreundlicher als die normale Langhantel.",cues:["Mittig in die Trap-Bar stellen, Füße hüftbreit","Hüfte nach hinten, Griffe greifen, Brust raus, Rücken lang","Boden „wegdrücken“, Hüfte und Schultern steigen gleichzeitig","Oben Gesäß anspannen, nicht ins Hohlkreuz lehnen","Kontrolliert absetzen, kurz neu spannen"],err:"Runder Rücken; Stange vom Körper weg; oben überstrecken.",easy:"Kettlebell-Kreuzheben vom Boden",hard:"Schwerer / explosiver hochziehen",q:"trap bar deadlift technique"},
 bss:{n:"Bulgarische Split Squats",c:"kraft",m:"Quadrizeps, Gesäß, Hüftstabilisatoren",why:"Laufen ist eine einbeinige Sportart. Diese Übung trainiert Kraft und Beckenstabilität pro Bein und deckt Seitenunterschiede auf – ein klassischer Schutz für Knie und Hüfte.",cues:["Hinterer Fuß mit dem Spann auf der Bank","Vorderer Fuß so weit vorn, dass das Knie über dem Fuß bleibt","Senkrecht nach unten, bis das hintere Knie fast den Boden berührt","Über die ganze vordere Fußsohle hochdrücken","Becken gerade halten, Knie zeigt in Richtung 2. Zeh"],err:"Knie fällt nach innen; Oberkörper kippt stark; Schritt zu kurz.",easy:"Ausfallschritt rückwärts ohne Bank",hard:"Kurzhanteln schwerer, 3 s exzentrisch",q:"bulgarian split squat technique"},
 calf:{n:"Wadenheben einbeinig",c:"kraft",m:"Wade (Gastrocnemius & Soleus), Achillessehne",why:"Die Wade trägt beim Laufen ein Vielfaches deines Körpergewichts. Starke Waden und Achillessehnen sind einer der wichtigsten Schutzfaktoren gegen Achillessehnen- und Schienbeinprobleme. Zwei Varianten: Knie gestreckt (Gastrocnemius) und Knie gebeugt (Soleus).",cues:["Fußballen auf eine Stufe, Ferse frei","Ganz nach unten in die Dehnung (2 s), ganz nach oben (1 s halten)","Variante 2: gleiche Bewegung sitzend oder mit ca. 30° gebeugtem Knie","Kurzhantel in der Hand der Trainingsseite"],err:"Hüpfen statt kontrollieren; nur halbe Bewegung.",easy:"Beidbeinig",hard:"Mehr Gewicht, Smith-Maschine",q:"single leg calf raise bent knee soleus"},
 squat:{n:"Kniebeuge (Goblet → Front)",c:"kraft",m:"Quadrizeps, Gesäß, Rumpf",why:"Kräftigt die Oberschenkelvorderseite, die beim Bergablaufen und auf dem Rad stark arbeitet. In Phase 1 als Goblet Squat (Gewicht vor der Brust), danach als Frontkniebeuge mit Langhantel.",cues:["Füße schulterbreit, Zehen leicht auswärts","Brust aufrecht, Ellenbogen nach vorn","Knie schieben in Richtung Zehen, Hüfte tief zwischen die Fersen","Ganzer Fuß bleibt am Boden","Kraftvoll hochdrücken"],err:"Fersen heben ab; Knie fallen nach innen; Rücken rundet unten.",easy:"Goblet Squat auf eine Box",hard:"Frontkniebeuge schwerer / explosiv",q:"front squat technique beginner"},
 stepup:{n:"Step-Up auf hohe Box",c:"kraft",m:"Gesäß, Quadrizeps",why:"Sehr nah an der Bewegung beim Bergauflaufen und Treppensteigen. Trainiert einbeinige Kraft ohne großen Stress für den Rücken.",cues:["Box etwa Kniehöhe","Ganzen Fuß auf die Box","Nur mit dem oberen Bein hochdrücken, unteres Bein nicht abstoßen","Langsam (3 s) wieder runter"],err:"Abstoßen vom Boden; Knie fällt nach innen.",easy:"Niedrigere Box",hard:"Kurzhanteln, Knie oben hochziehen",q:"dumbbell step up technique"},
 nordic:{n:"Nordic Hamstring Curl",c:"kraft",m:"Hintere Oberschenkel",why:"Eine der am besten belegten Übungen zur Vorbeugung von Zerrungen der hinteren Oberschenkel. Rein exzentrisch – du bremst den Fall.",cues:["Kniend auf Matte, Fersen fixiert (Partner, Hantelstange oder Gerät)","Körper von Knie bis Kopf gerade","So langsam wie möglich nach vorn fallen lassen","Mit den Händen abfangen, mit Händen zurückdrücken"],err:"In der Hüfte abknicken; zu schnell fallen.",easy:"Nur kurze Strecke ablassen, Band als Hilfe",hard:"Weiter ablassen, ohne Hände zurück",q:"nordic hamstring curl beginner"},
 pullup:{n:"Klimmzug / Latzug",c:"kraft",m:"Latissimus, oberer Rücken, Bizeps",why:"Der Latissimus ist der wichtigste Antriebsmuskel im Kraulschwimmen. Mehr Zugkraft bedeutet mehr Vortrieb pro Zug.",cues:["Schulterbreit, Handflächen vom Körper weg","Zuerst Schulterblätter nach unten ziehen","Brust zur Stange, Ellenbogen Richtung Hosentaschen","Kontrolliert ganz nach unten"],err:"Schwung holen; Schultern zu den Ohren.",easy:"Latzug am Kabel oder Band-Unterstützung",hard:"Zusatzgewicht am Gürtel",q:"pull up technique beginner"},
 dbrow:{n:"Einarmiges Kurzhantel-Rudern",c:"kraft",m:"Latissimus, Rhomboiden, hintere Schulter",why:"Gleicht die nach vorn gerichtete Haltung vom Rad und Schwimmen aus und stärkt die Schulterblattmuskulatur.",cues:["Knie und Hand auf der Bank, Rücken flach","Hantel Richtung Hüfte ziehen, nicht zur Brust","Oben 1 s halten, Schulterblatt zur Wirbelsäule","Langsam ablassen"],err:"Oberkörper dreht auf; Ziehen mit dem Arm statt Rücken.",easy:"Leichteres Gewicht",hard:"Schwerer, 2 s Halt oben",q:"single arm dumbbell row technique"},
 landmine:{n:"Landmine Press einarmig",c:"kraft",m:"Brust, vordere Schulter, Trizeps, Rumpf",why:"Schulterfreundliche Druckübung im schrägen Winkel. Ideal für Schwimmer, deren Schultern über Kopf schon genug arbeiten.",cues:["Langhantel in Ecke oder Landmine-Halterung","Halbkniend oder stehend, Ende der Stange auf Schulterhöhe","Schräg nach oben-vorn drücken, Rumpf fest","Schulterblatt darf mit nach vorn gleiten"],err:"Hohlkreuz; Körper dreht weg.",easy:"Liegestütz",hard:"Stehend, explosiv drücken",q:"half kneeling landmine press"},
 facepull:{n:"Face Pull",c:"core",m:"Rotatorenmanschette, hintere Schulter",why:"Stärkt die Außenrotatoren der Schulter – die kleinen Muskeln, die beim Schwimmen Überlastungen verhindern. Pflichtübung für Triathleten.",cues:["Seil am Kabelzug auf Kopfhöhe","Zum Gesicht ziehen, Hände enden neben den Ohren","Daumen zeigen nach hinten (Außenrotation)","Leichtes Gewicht, saubere Bewegung"],err:"Zu schwer; Zurücklehnen.",easy:"Mit Theraband",hard:"2 s Halt in Endposition",q:"face pull technique"},
 tib:{n:"Tibialis Raise",c:"kraft",m:"Schienbeinmuskel",why:"Der Gegenspieler der Wade. Ein kräftiger Schienbeinmuskel schützt vor Schienbeinkantensyndrom (Shin Splints).",cues:["Rücken an die Wand, Fersen ca. 30 cm davor","Zehen so hoch wie möglich ziehen","Langsam absenken, Fersen bleiben am Boden"],err:"Zu schnell; Hüfte weicht aus.",easy:"Füße näher an die Wand",hard:"Kettlebell über die Zehen hängen",q:"tibialis raise wall"},
 goblet:{n:"KB Goblet Squat (Tempo)",c:"kraft",m:"Quadrizeps, Gesäß, Rumpf",why:"Kniebeuge mit der Kettlebell vor der Brust – ideal für zuhause. Das langsame Tempo macht auch ein leichteres Gewicht anspruchsvoll.",cues:["Kettlebell an den Hörnern vor der Brust","3 s nach unten, Ellenbogen zwischen die Knie","Unten kurz halten","Zügig hoch"],err:"Fersen heben ab; Rücken rundet.",easy:"Auf einen Stuhl setzen",hard:"2 s Pause unten, 1½-Wiederholungen",q:"kettlebell goblet squat"},
 kbsldl:{n:"Einbeiniges KB-Kreuzheben",c:"kraft",m:"Hintere Oberschenkel, Gesäß, Fußstabilität",why:"Kraft und Gleichgewicht auf einem Bein, genau wie in der Standphase beim Laufen. Trainiert nebenbei die kleinen Fußmuskeln.",cues:["Kettlebell in der Hand gegenüber dem Standbein","Hüfte nach hinten schieben, freies Bein hinten als Verlängerung","Rücken gerade, Becken bleibt parallel zum Boden","Über das Gesäß zurück in den Stand"],err:"Becken dreht auf; Rücken rundet.",easy:"Hand an der Wand abstützen",hard:"Schwerere KB, Pause unten",q:"single leg kettlebell deadlift"},
 kbrow:{n:"KB Rudern vorgebeugt",c:"kraft",m:"Latissimus, oberer Rücken",why:"Zugkraft für das Schwimmen, auch auf Reisen. Vorgebeugt mit Hüftbeugung trainiert es zugleich den unteren Rücken.",cues:["Hüftbreit stehen, Oberkörper ca. 45° nach vorn","Freie Hand auf dem Oberschenkel","KB Richtung Hüfte ziehen","Langsam ablassen"],err:"Rücken rundet; Schwung holen.",easy:"Mit Abstützen an Stuhl",hard:"2 s Halt oben",q:"kettlebell bent over row"},
 tgu:{n:"Turkish Get-Up",c:"core",m:"Schulter, Rumpf, Hüfte – ganzer Körper",why:"Kraft, Schulterstabilität und Koordination in einer Bewegung. Für Schwimmer besonders wertvoll, weil die Schulter in vielen Winkeln stabil bleiben muss.",cues:["Erst ohne Gewicht (oder Schuh auf der Faust) lernen","Rückenlage, Arm mit KB gestreckt, Blick zur KB","Auf Ellenbogen → Hand → Hüfte hoch → Bein durchziehen → Knien → Aufstehen","Arm bleibt immer senkrecht, gleicher Weg zurück"],err:"Zu schwer starten; Arm knickt ein.",easy:"Nur bis zum Ellenbogen/Hand",hard:"Schwerere KB",q:"turkish get up step by step"},
 carry:{n:"Suitcase Carry",c:"core",m:"Seitliche Rumpfmuskulatur, Griff",why:"Eine schwere KB einseitig tragen und dabei gerade bleiben. Stabilisiert das Becken – wichtig für eine saubere Lauftechnik am Ende langer Einheiten.",cues:["Schwere KB in einer Hand","Aufrecht, Schultern auf gleicher Höhe","Langsam und kontrolliert gehen","Seite wechseln"],err:"Zur Seite neigen.",easy:"Leichter / kürzer",hard:"Schwerer, auf einer Linie gehen",q:"suitcase carry kettlebell"},
 halo:{n:"KB Halo",c:"mob",m:"Schultern, Brustwirbelsäule",why:"Mobilisiert die Schultern als Aufwärmen – gut vor dem Schwimmen und vor jeder Kraft-Session.",cues:["KB umgedreht an den Hörnern halten","Eng um den Kopf kreisen","Rumpf fest, kein Hohlkreuz","Richtung wechseln"],err:"Zu weit vom Kopf weg.",easy:"Leichtere KB / Hantelscheibe",hard:"Halbkniend",q:"kettlebell halo"},
 sideplank:{n:"Seitstütz mit Rotation",c:"core",m:"Seitliche Bauchmuskeln, Gesäß, Schulter",why:"Seitliche Rumpfkraft hält das Becken beim Laufen stabil und verhindert das Absinken der Hüfte.",cues:["Ellenbogen unter der Schulter, Körper gerade Linie","Hüfte hoch, nicht absinken lassen","Variante: oberen Arm unter dem Körper durchfädeln und zurück"],err:"Hüfte sackt durch; Schulter zu den Ohren.",easy:"Auf den Knien",hard:"Oberes Bein abheben",q:"side plank with rotation"},
 copen:{n:"Copenhagen Plank",c:"core",m:"Adduktoren (Innenseite Oberschenkel), seitlicher Rumpf",why:"Gut belegt zur Vorbeugung von Leisten- und Adduktorenproblemen. Stärkt die Innenseite, die beim Laufen das Becken mitstabilisiert.",cues:["Seitstütz, oberes Bein auf einer Bank","Kurzer Hebel: Knie auf der Bank (leichter)","Langer Hebel: Fuß auf der Bank (schwer)","Hüfte hoch, Körper gerade"],err:"Zu früh mit langem Hebel starten.",easy:"Kurzer Hebel, unteres Bein stützt mit",hard:"Langer Hebel, unteres Bein heben/senken",q:"copenhagen plank progression"},
 pallof:{n:"Pallof Press",c:"core",m:"Tiefe Rumpfmuskulatur",why:"Anti-Rotation: Der Rumpf lernt, Drehkräften zu widerstehen. So geht weniger Energie verloren, auf dem Rad wie beim Laufen.",cues:["Seitlich zum Kabelzug oder Band stehen","Griff vor der Brust, Arme gerade nach vorn drücken","Oberkörper darf sich nicht drehen","2 s halten, zurück"],err:"Zu schwer, Körper dreht mit.",easy:"Weniger Gewicht, breiter Stand",hard:"Halbkniend, Halt länger",q:"pallof press"},
 deadbug:{n:"Dead Bug",c:"core",m:"Tiefe Bauchmuskulatur",why:"Rumpfspannung bei gleichzeitiger Arm- und Beinbewegung – die Grundlage für einen ruhigen Oberkörper beim Laufen und eine stabile Wasserlage.",cues:["Rückenlage, Arme zur Decke, Knie 90°","Unteren Rücken in den Boden drücken","Gegengleich Arm und Bein langsam strecken","Ausatmen beim Strecken"],err:"Rücken hebt ab; zu schnell.",easy:"Nur Beine bewegen",hard:"Kettlebell in den Händen",q:"dead bug exercise"},
 pogo:{n:"Pogo Jumps",c:"power",m:"Waden, Achillessehne, Fußgewölbe",why:"Kleine, schnelle Sprünge aus dem Fußgelenk. Trainiert die Federwirkung der Achillessehne. Diese „Steifigkeit“ ist einer der stärksten Faktoren für eine gute Laufökonomie.",cues:["Knie fast gestreckt, Sprung nur aus dem Sprunggelenk","Kurzer Bodenkontakt – „heißer Boden“","Auf dem Vorfuß landen, Ferse berührt nicht","Rhythmisch und leise"],err:"Aus den Knien springen; zu hoch springen.",easy:"Seilspringen",hard:"Einbeinig",q:"pogo jumps runners"},
 boxjump:{n:"Box Jump",c:"power",m:"Beine, Hüfte – Explosivkraft",why:"Lehrt das Nervensystem, viel Kraft schnell abzurufen. Auf die Box springen schont die Gelenke, weil die Landung weich ist.",cues:["Hüftbreit, Arme zurückschwingen","Explosiv springen, leise auf der Box landen","Landung in halber Hocke, Knie über den Füßen","Herunter steigen, nicht springen"],err:"Zu hohe Box; harte Landung; Knie fallen nach innen.",easy:"Niedrige Box / Squat Jump ohne Box",hard:"Höhere Box, einbeinige Landung",q:"box jump technique beginner"},
 latbound:{n:"Seitsprünge (Skater Bounds)",c:"power",m:"Gesäß, Hüftabduktoren, Fußgelenk",why:"Ausdauersport passiert fast nur in einer Ebene. Seitliche Sprünge stärken Hüfte und Sprunggelenk gegen Umknicken und Hüftprobleme.",cues:["Von einem Bein seitlich auf das andere springen","Landung weich, 1–2 s stabil halten","Knie über dem Fuß, Becken gerade","Weite langsam steigern"],err:"Instabile Landung; Knie knickt ein.",easy:"Kleine Sprünge ohne Halt",hard:"Weiter, direkt weiterspringen",q:"skater bounds exercise"},
 mbrot:{n:"Medizinball-Rotationswurf",c:"power",m:"Rumpf, Hüfte, Schultern",why:"Explosive Rotation aus der Hüfte. Überträgt Rumpfkraft in Schnelligkeit und lockert gleichzeitig den Oberkörper nach Radeinheiten.",cues:["Seitlich zur Wand, ca. 1 m Abstand","Ball an der hinteren Hüfte, Hüfte eindrehen","Explosiv aus Beinen und Hüfte drehen und werfen","Ball fangen, wiederholen"],err:"Nur aus den Armen werfen.",easy:"Leichter Ball (3 kg)",hard:"Schwererer Ball (5–6 kg), schneller",q:"medicine ball rotational throw"},
 swing:{n:"Kettlebell Swing",c:"power",m:"Gesäß, hintere Oberschenkel, Rumpf",why:"Die Kettlebell-Übung schlechthin: explosive Hüftstreckung, Kraftausdauer der hinteren Kette und ein Pulsanstieg. Sehr effektiv für Radfahrer und Läufer.",cues:["Hüftbewegung, keine Kniebeuge: Hüfte nach hinten schieben","KB zwischen den Beinen hoch nach hinten schwingen","Hüfte explosiv nach vorn, Gesäß fest – KB schwebt auf Brusthöhe","Arme sind nur Seile, sie heben nicht"],err:"Mit den Armen heben; Rücken rund; KB über Kopf.",easy:"Kreuzheben mit KB zuerst lernen",hard:"Schwerere KB, einarmig",q:"kettlebell swing technique beginner"},
 hip9090:{n:"90/90 Hüftwechsel",c:"mob",m:"Hüfte (Innen- und Außenrotation)",why:"Radfahren macht die Hüfte steif. Diese Übung hält beide Rotationsrichtungen beweglich.",cues:["Sitzen, beide Knie 90° gebeugt, zu einer Seite gelegt","Knie zur anderen Seite kippen, ohne Hände","Oberkörper aufrecht","Langsam, 5–8× pro Seite"],err:"Mit den Händen ziehen; Rücken rund.",easy:"Hände hinten abstützen",hard:"Oberkörper vorlehnen über vorderes Bein",q:"90 90 hip switch"},
 wgs:{n:"World's Greatest Stretch",c:"mob",m:"Hüftbeuger, Brustwirbelsäule, hintere Oberschenkel",why:"Eine Übung für fast alles, was Radfahren und Laufen verkürzen: Hüftbeuger, Brustwirbelsäule, Leiste.",cues:["Tiefer Ausfallschritt, hinteres Knie am Boden","Gleiche Hand wie vorderes Bein neben den Fuß","Ellenbogen Richtung Fußknöchel","Arm zur Decke aufdrehen, Blick folgt"],err:"Zu hastig.",easy:"Hinteres Knie auf Kissen",hard:"Mit Streckung des vorderen Beins kombinieren",q:"worlds greatest stretch"},
 ankle:{n:"Knie-zur-Wand",c:"mob",m:"Sprunggelenk, Wade",why:"Beweglichkeit im Sprunggelenk entlastet Knie und Achillessehne beim Laufen.",cues:["Fuß ca. eine Handbreit vor der Wand","Knie Richtung Wand schieben, Ferse bleibt am Boden","Knie über den 2. Zeh, nicht nach innen","10× pro Seite, Abstand langsam vergrößern"],err:"Ferse hebt ab.",easy:"Kürzerer Abstand",hard:"Mit KB auf dem Knie",q:"knee to wall ankle mobility"},
 openbook:{n:"Open Book",c:"mob",m:"Brustwirbelsäule, Brust",why:"Gegenmittel zur Aero-Position. Eine bewegliche Brustwirbelsäule macht auch die Rotation beim Kraulen leichter.",cues:["Seitlage, Knie 90° angewinkelt übereinander","Arme gestreckt nach vorn","Oberen Arm wie eine Buchseite nach hinten öffnen","Blick folgt der Hand, Knie bleiben zusammen"],err:"Knie gehen auseinander.",easy:"Kissen unter den Kopf",hard:"Endposition 3 Atemzüge halten",q:"open book thoracic rotation"},
 shortfoot:{n:"Short Foot & Zehen-Yoga",c:"mob",m:"Fußmuskulatur",why:"Die kleinen Fußmuskeln halten das Fußgewölbe. Ein starker Fuß schützt vor Plantarfasziitis und Überlastungen im Schienbein.",cues:["Barfuß, Fußballen Richtung Ferse ziehen, ohne Zehen zu krallen","Gewölbe hebt sich, 5 s halten","Zehen-Yoga: Großzeh hoch, andere unten – dann umgekehrt"],err:"Zehen krallen.",easy:"Im Sitzen",hard:"Im Einbeinstand",q:"short foot exercise"},
 balance:{n:"Einbein-Balance mit Reichweite",c:"mob",m:"Fuß, Sprunggelenk, Hüfte",why:"Schult die Gelenkstabilität und Propriozeption (Körpergefühl). Verringert das Risiko, beim Trail- oder Straßenlauf umzuknicken.",cues:["Einbeinstand, leicht gebeugtes Knie","Freien Fuß nach vorn, seitlich und hinten tippen (Y-Form)","Becken stabil","Steigern: Augen zu oder auf Kissen"],err:"Knie knickt nach innen.",easy:"Ohne Tippen nur stehen",hard:"Augen zu / weiche Unterlage",q:"y balance exercise single leg"},
 ytw:{n:"Y-T-W",c:"mob",m:"Unterer Trapez, hintere Schulter",why:"Kräftigt die Schulterblattmuskulatur – Schutz für die Schwimmschulter und Gegenpol zur Radhaltung.",cues:["Bauchlage auf Schrägbank oder Boden","Arme als Y, T, W anheben, Daumen zeigen nach oben","2 s halten pro Wiederholung","Ohne oder mit sehr leichten Gewichten"],err:"Schultern zu den Ohren.",easy:"Ohne Gewicht am Boden",hard:"1–2 kg Hanteln",q:"YTW exercise shoulder"},

function persist(which){
  LS.set(which==="prefs"?"kp4_prefs":"kp4_logs",which==="prefs"?ST:LOGS);
  if(!DB||!UID||!remoteReady)return;
  clearTimeout(timers[which]);
  timers[which]=setTimeout(()=>{const body=JSON.parse(JSON.stringify(which==="prefs"?ST:{logs:LOGS}));
    chain[which]=chain[which].then(()=>DB.doc(`data/users/${UID}/${which}`).set(body)).catch(e=>{if(e&&e.code==="quota_exceeded")toast("Speicher voll – alte Einträge löschen.");else if(e&&e.code==="invalid_argument"){syncMode="local";render()}})},600);
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    try{if((await user.can("data.write"))===false&&!(await user.isOwner()))return}catch(e){}
    DB=db;UID=id;
    const [p,l]=await Promise.all([db.doc(`data/users/${id}/prefs`).get(),db.doc(`data/users/${id}/logs`).get()]);
    if(p.exists){Object.assign(ST,JSON.parse(JSON.stringify(p.data())))}
    if(l.exists){LOGS=JSON.parse(JSON.stringify(l.data().logs||{}))}
    syncMode="cloud";remoteReady=true;
    if(!p.exists&&(ST.lastActive||Object.keys(ST.done).length))persist("prefs");
    if(!l.exists&&Object.keys(LOGS).length)persist("logs");
    LS.set("kp4_prefs",ST);LS.set("kp4_logs",LOGS);
    render();
  }catch(e){syncMode="local"}
}

const dd=(id,cls="",st="")=>`<svg class="dd ${cls}" viewBox="0 0 100 100" aria-hidden="true"${st?` style="${st}"`:""}><use href="#d-${id}"/></svg>`;
const PH_DD=[["flower","g"],["bolt","y"],["star","o"],["heart","r"]];
const CAT_DD={kraft:["kb","b"],power:["bolt","o"],core:["spiral","g"],mob:["flower","v"]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const week=()=>ST.week;
const dkey=s=>`${ST.week}_${s}`;
const getDone=s=>ST.done[dkey(s)]||[];
function rx(item){const a=item[1];return a.length===1?a[0]:a[phaseOf(ST.week)]}
function slotEx(sk,i){return ST.swaps[sk+":"+i]||S[sk].items[i][0]}
function parseRx(r){const m=String(r).match(/(\d+)\s*[×x]\s*(\d+)(?:[–-]\d+)?\s*(s|m)?/);if(m)return{sets:+m[1],reps:+m[2],unit:m[3]==="s"?"s":m[3]==="m"?"m":"r"};const n=String(r).match(/^(\d+)/);return{sets:1,reps:n?+n[1]:10,unit:/ s/.test(r)?"s":"r"}}
const unitLabel=u=>u==="s"?"Sek":u==="m"?"Meter":"Wdh";
function lastLog(id){const l=LOGS[id];return l&&l.length?l[l.length-1]:null}
function fmtSets(e){if(!e)return"";const s=e.s,u=unitLabel(e.u||"r");const kgs=s.map(x=>x[0]||0).filter(x=>x!==0);const top=kgs.length?Math.max(...kgs):0;
  const same=s.every(x=>x[1]===s[0][1]);const xs=e.x?s.map(x=>x[2]||0).filter(Boolean):[];
  const bwk=e.bw!=null;
  return `${s.length}×${same?s[0][1]:s.map(x=>x[1]).join("/")} ${u}${xs.length?` · ${e.x==="bench"?"Bank":"Box"} ${Math.max(...xs)} cm`:""}${top?` · ${bwk&&top>0?"+":""}${kgTxt(top)} kg`:""}${bwk?` · KG ${kgTxt(e.bw)} kg`:""}`}
function metric(e){const xs=e.x?e.s.map(x=>x[2]||0).filter(Boolean):[];if(xs.length)return{v:Math.max(...xs),u:"cm"};
  const kgs=e.s.map(x=>x[0]||0).filter(x=>x!==0);return kgs.length?{v:Math.max(...kgs),u:"kg"}:{v:Math.max(...e.s.map(x=>x[1]||0)),u:unitLabel(e.u||"r")}}
function spark(vals,w=92,h=34){if(vals.length<2)return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><circle cx="${w-4}" cy="${h/2}" r="3.5" fill="var(--c-core)"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>[4+i*(w-8)/(vals.length-1),h-4-(v-mn)/r*(h-8)]);
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(" ")).join("L")}" fill="none" stroke="var(--c-core)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="3.5" fill="var(--c-core)" stroke="#111" stroke-width="1.2"/></svg>`}

function comeback(){
  if(!ST.lastActive)return null;const gap=daysBetween(ST.lastActive,today());if(gap<10)return null;
  const lw=ST.lastWeek||ST.week;let back,pct;
  if(gap<21){back=Math.max(1,lw-1);pct=10}else if(gap<43){back=Math.max(1,lw-3);pct=20}else{back=1;pct=30}
  return{gap,lw,back,pct};
}
function comebackCard(){const c=comeback();if(!c)return"";

function bwChart(){
  const b=ST.body.slice(-30);if(b.length<2)return "";
  const W=320,H=120,pad=26,vals=b.map(x=>x.kg),mn=Math.floor(Math.min(...vals)-.5),mx=Math.ceil(Math.max(...vals)+.5),r=mx-mn||1;
  const X=i=>pad+i*(W-pad-10)/(b.length-1),Y=v=>H-18-(v-mn)/r*(H-30);
  const pts=b.map((x,i)=>[X(i),Y(x.kg)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Körpergewicht Verlauf">
   <path d="M${pad} ${Y(mx)}H${W-6}M${pad} ${Y(mn)}H${W-6}" stroke="var(--grid-strong)" stroke-dasharray="3 4"/>
   <text x="0" y="${Y(mx)+3}">${mx}</text><text x="0" y="${Y(mn)+3}">${mn}</text>
   <path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(" ")).join("L")}L${pts.at(-1)[0].toFixed(1)} ${H-18}L${pad} ${H-18}Z" fill="var(--c-core)" fill-opacity=".14"/>
   <path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(" ")).join("L")}" fill="none" stroke="var(--c-core)" stroke-width="2.6" stroke-linejoin="round"/>
   <circle cx="${pts.at(-1)[0].toFixed(1)}" cy="${pts.at(-1)[1].toFixed(1)}" r="4.5" fill="var(--c-core)" stroke="#111" stroke-width="1.5"/>
   <text x="${pad}" y="${H-3}">${fmtDate(b[0].d)}</text><text x="${W-6}" y="${H-3}" text-anchor="end">${fmtDate(b.at(-1).d)}</text></svg>`;
}

function vInfos(){
  return `<section class="view"><div class="card">
   <details open><summary>Welche Kettlebell soll ich kaufen?</summary>
     <p>Für den Start <b>eine 16-kg-Kettlebell</b>: passt für Swings, Goblet Squats, Kreuzheben, Rudern und den Zirkel. Für den Turkish Get-Up erst mit einem Schuh üben.</p>
     <ul><li>Nach 2–3 Monaten: <b>20 oder 24 kg</b> für Swings und Kreuzheben.</li>
     <li>Gusseisen, glatter breiter Griff, flacher Boden.</li>
     <li>Dazu ein <b>Widerstandsband</b> (ca. 10 €) für Pull-Aparts, Hüftrotation und Klimmzug-Hilfe.</li></ul></details>
   <details><summary>Gewicht & Wiederholungen eintragen</summary>
     <p>Öffne eine Übung aus einer Einheit. Unter „Heute eintragen“ stehen deine Sätze, vorausgefüllt mit dem letzten Mal. Gewicht und Wiederholungen anpassen, speichern – fertig. Bei Halte-Übungen trägst du Sekunden ein.</p>
     <p>Halte-Übungen wie Planks haben eine <b>Stoppuhr</b> mit Sollzeit: 3 s Vorlauf, Piepen und Vibrieren am Ende, automatisch Seitenwechsel und Pause. Danach stehen die Zeiten direkt im Eintrag. Am iPhone im Lautlos-Modus gibt es keinen Ton, die Uhr blinkt dann nur.</p>
     <p>Im Reiter <b>Fortschritt</b> siehst du deinen Verlauf, dein Körpergewicht und nach einer Pause, wo du aufgehört hast.</p></details>
   <details><summary>Plan und Sonntags-Rückmeldung</summary>
     <p>Im Reiter <b>Plan</b> stehen immer die nächsten zwei Wochen mit Schwimmen, Rad, Laufen und Kraft. Unterstrichene Krafteinheiten öffnest du mit einem Tipp.</p>
     <p>Sonntags füllst du unten im Plan die Rückmeldung aus. Claude liest sie am Sonntagabend zusammen mit deinen Strava-Daten, passt die laufenden zwei Wochen an und hängt die nächste Woche an. Die Antwort steht dann direkt unter deiner Rückmeldung.</p></details>
   <details><summary>Was bedeutet RIR?</summary>
     <p><b>RIR = Reps in Reserve</b> – wie viele Wiederholungen du noch sauber geschafft hättest. RIR 3 heißt: aufhören, obwohl drei weitere gingen.</p></details>
   <details><summary>Wie steigere ich das Gewicht?</summary>
     <p>Wenn alle Sätze mit mehr Reserve als angegeben gelingen: +2,5–5 kg bei Kreuzheben und Kniebeuge, +1–2 kg bei Kurzhanteln.</p></details>
   <details><summary>Nach einer Pause?</summary>
     <p>Die App merkt sich dein letztes Training. Nach 10+ Tagen schlägt sie dir vor, wo du wieder einsteigst und wie viel leichter du startest.</p></details>
   <details><summary>Warum Sprünge und Isometrie?</summary>

/* ---------- Stoppuhr für Halte-Übungen ---------- */
// Ablauf: 3 s Bereit → Halten → (Seite wechseln 5 s) → Pause → nächster Satz. Zeitbasis Date.now, damit Drosselung im Hintergrund nichts verschiebt.
let TM=null,AC=null,WL=null;
let SOUND=LS.get("kp_sound",true);
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
